<body>

    <div class="window">
        <div class="title-bar">
            <div class="title-stripes"></div>
            <div class="close-box" onclick="window.location.href='index'">X</div>
            <span class="title-text" data-i18n="recover.title">Recover your account</span>
        </div>

        <div class="window-content">
            <h1 data-i18n="recover.heading">Use a recovery code</h1>
            <p data-i18n="recover.intro">Enter your username, the recovery code you saved, and a new password. The
                code works once and then stops working.</p>

            <form id="recover-form" onsubmit="submitRecovery(event)">
                <label for="recover-username" data-i18n="recover.username">Username</label>
                <input id="recover-username" type="text" autocomplete="username" autocapitalize="none"
                    spellcheck="false" maxlength="40" required>

                <label for="recover-code" data-i18n="recover.code">Recovery code</label>
                <input id="recover-code" class="code" type="text" autocomplete="off" autocapitalize="characters"
                    spellcheck="false" maxlength="29" placeholder="XXXX-XXXX-XXXX-XXXX-XXXX" required>

                <label for="recover-password" data-i18n="recover.new_password">New password</label>
                <input id="recover-password" type="password" autocomplete="new-password" minlength="8" maxlength="128"
                    required>

                <label for="recover-confirm" data-i18n="recover.confirm">Confirm new password</label>
                <input id="recover-confirm" type="password" autocomplete="new-password" minlength="8" maxlength="128"
                    required>

                <button type="submit" class="primary" id="recover-submit" data-i18n="recover.submit">Reset
                    password</button>
            </form>

            <p class="status" id="recover-status" role="status"></p>
            <div class="success" id="recover-success" style="display:none;">
                <p data-i18n="recover.success">Your password has been changed. Sign in with the new password.</p>
                <a href="index?login=true" data-i18n="recover.login">Go to sign in</a>
            </div>
            <p style="margin-top:14px; font-size:0.85rem;"><a href="index?login=true"
                    data-i18n="recover.back">Back to sign in</a></p>
        </div>
    </div>

    <script>
        (function () {
            'use strict';

            var firebaseConfig = {
                apiKey: "AIzaSyDY7x7vVmlYUyVZNLuCCmIQYa6PWFVfZqQ",
                authDomain: "rekindle-dd1fa.firebaseapp.com",
                projectId: "rekindle-dd1fa",
                storageBucket: "rekindle-dd1fa.firebasestorage.app",
                messagingSenderId: "748026882518",
                appId: "1:748026882518:web:6877dd4329318070c11c77",
                databaseURL: "https://rekindle-dd1fa-default-rtdb.firebaseio.com/"
            };

            if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);

            function t(key, fallback) {
                return window.t ? window.t(key, fallback) : fallback;
            }

            function setStatus(message, isError) {
                var el = document.getElementById('recover-status');
                el.textContent = message || '';
                el.className = 'status' + (isError ? ' error' : '');
            }

            window.submitRecovery = function (event) {
                if (event) event.preventDefault();
                var username = document.getElementById('recover-username').value.trim();
                var code = document.getElementById('recover-code').value;
                var password = document.getElementById('recover-password').value;
                var confirm = document.getElementById('recover-confirm').value;
                var submit = document.getElementById('recover-submit');

                if (!username) { setStatus('Enter your username.', true); return; }
                if (!window.RekindleRecovery || !window.RekindleRecovery.isValidCode(code)) {
                    setStatus('That recovery code is not the right shape. Check for missing or extra characters.', true);
                    return;
                }
                if (password.length < 8) { setStatus('The new password must be at least 8 characters.', true); return; }
                if (password !== confirm) { setStatus('The two passwords do not match.', true); return; }

                submit.disabled = true;
                setStatus('Checking your recovery code...', false);

                firebase.functions().httpsCallable('resetWithRecoveryCode')({
                    username: username,
                    code: window.RekindleRecovery.normaliseCode(code),
                    newPassword: password
                }).then(function () {
                    document.getElementById('recover-form').style.display = 'none';
                    document.getElementById('recover-success').style.display = 'block';
                    setStatus('', false);
                }).catch(function (error) {
                    submit.disabled = false;
                    var message = 'That username or recovery code is not valid.';
                    if (error && error.code === 'functions/resource-exhausted') {
                        message = 'Too many attempts. Please wait and try again.';
                    } else if (error && error.code === 'functions/invalid-argument' && error.message) {
                        message = error.message;
                    }
                    setStatus(message, true);
                });
            };
        })();
    </script>
    <script>
        window.addEventListener('load', function () {
            if (window.rekindleApplyWallpaper) window.rekindleApplyWallpaper();
        });
