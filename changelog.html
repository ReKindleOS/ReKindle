<!DOCTYPE html>
<html lang="en">

<head>
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no">
    <meta charset="UTF-8">
    <meta name="description" content="Every commit to ReKindle, newest first.">
    <title>Changelog - ReKindle</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">

    <script src="js/i18n.js?v=4"></script>
    <script src="theme.js?v=35"></script>

    <style>
        :root {
            --shadow: 4px 4px 0px #000000;
            --stripe-pattern: repeating-linear-gradient(0deg, transparent, transparent 2px, #000 3px, #000 4px);
        }

        *,
        *::before,
        *::after {
            transition: none !important;
            animation: none !important;
            box-sizing: border-box;
        }

        body {
            background-color: #e5e5e5;
            background-repeat: repeat;
            background-position: top left;
            font-family: "Geneva", "Verdana", sans-serif;
            image-rendering: pixelated;
            margin: 0;
            padding: 20px;
            height: 100vh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #000;
        }

        .window {
            background: white;
            border: 2px solid black;
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            height: 90vh;
            width: 100%;
            max-width: 820px;
            position: relative;
        }

        .title-bar {
            height: 35px;
            border-bottom: 2px solid black;
            display: flex;
            align-items: center;
            justify-content: center;
            background: white;
            position: relative;
            flex-shrink: 0;
        }

        .title-stripes {
            position: absolute;
            top: 4px;
            bottom: 4px;
            left: 4px;
            right: 4px;
            background-image: var(--stripe-pattern);
            z-index: 0;
        }

        .title-text {
            background: white;
            padding: 0 15px;
            font-weight: bold;
            font-size: 1.1rem;
            z-index: 1;
            display: inline-flex;
            align-items: center;
            height: 100%;
            box-sizing: border-box;
        }

        .close-box {
            position: absolute;
            left: 10px;
            width: 18px;
            height: 18px;
            border: 2px solid black;
            background: white;
            z-index: 2;
            box-shadow: 2px 2px 0 black;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-family: sans-serif;
            font-size: 0.9rem;
            line-height: 1;
        }

        .close-box:active {
            background: black;
            color: white;
            transform: translate(1px, 1px);
            box-shadow: none;
        }

        .window-content {
            flex-grow: 1;
            overflow-y: auto;
            padding: 24px 28px 32px;
            background: white;
            -webkit-overflow-scrolling: touch;
        }

        .page-head {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            border-bottom: 2px solid black;
            padding-bottom: 12px;
            margin-bottom: 14px;
        }

        .head-text {
            min-width: 0;
        }

        h1 {
            font-size: 1.5rem;
            margin: 0 0 5px 0;
            line-height: 1.1;
        }

        .subtitle {
            margin: 0;
            font-size: 0.8rem;
            line-height: 1.4;
            color: #333;
        }

        .github-link {
            flex-shrink: 0;
            margin-left: 16px;
            padding: 8px 12px;
            border: 2px solid black;
            box-shadow: 2px 2px 0 black;
            background: white;
            color: black;
            text-decoration: none;
            font-size: 0.75rem;
            font-weight: bold;
            line-height: 1.2;
            text-align: center;
        }

        .github-link:active {
            background: black;
            color: white;
            box-shadow: none;
            transform: translate(2px, 2px);
        }

        .toolbar {
            display: flex;
            align-items: stretch;
            margin-bottom: 6px;
        }

        #commit-filter {
            flex: 1 1 auto;
            min-width: 0;
            border: 2px solid black;
            border-radius: 0;
            background: white;
            color: black;
            padding: 9px 10px;
            font-family: inherit;
            font-size: 0.85rem;
            -webkit-appearance: none;
            appearance: none;
        }

        #commit-filter:focus {
            outline: 2px solid black;
            outline-offset: 1px;
        }

        .sys-btn {
            background: white;
            border: 2px solid black;
            color: black;
            padding: 8px 16px;
            font-weight: bold;
            font-family: inherit;
            font-size: 0.8rem;
            cursor: pointer;
            box-shadow: 2px 2px 0 black;
            min-height: 42px;
        }

        .sys-btn:active {
            background: black;
            color: white;
            box-shadow: none;
            transform: translate(2px, 2px);
        }

        .sys-btn:disabled {
            color: #666;
            cursor: default;
            box-shadow: none;
            transform: none;
            background: #e5e5e5;
        }

        #refresh-btn {
            flex-shrink: 0;
            margin-left: 8px;
        }

        .status {
            min-height: 18px;
            margin: 8px 0 4px;
            font-size: 0.75rem;
            line-height: 1.35;
            color: #444;
        }

        .commit-list {
            margin-top: 4px;
        }

        .commit-group {
            margin-top: 18px;
        }

        .commit-date {
            border-bottom: 2px solid black;
            padding-bottom: 4px;
            margin: 0 0 4px;
            font-size: 0.85rem;
            font-weight: bold;
            line-height: 1.2;
        }

        .commit {
            padding: 9px 0;
            border-bottom: 1px dotted #888;
        }

        .commit:last-child {
            border-bottom: none;
        }

        .commit-msg {
            display: block;
            color: black;
            text-decoration: underline;
            font-size: 0.9rem;
            font-weight: bold;
            line-height: 1.35;
            overflow-wrap: break-word;
            word-wrap: break-word;
        }

        .commit-msg:active {
            background: black;
            color: white;
        }

        .commit-meta {
            margin-top: 4px;
            font-size: 0.7rem;
            line-height: 1.5;
            color: #555;
        }

        .meta-item {
            display: inline-block;
            margin-right: 12px;
        }

        .commit-sha {
            font-family: "Courier New", monospace;
            border: 1px solid #999;
            padding: 0 3px;
            color: #333;
        }

        .empty-state {
            margin: 28px 8px;
            padding: 18px;
            border: 2px dashed #777;
            text-align: center;
            font-size: 0.85rem;
            line-height: 1.5;
            color: #444;
        }

        .load-more-wrap {
            display: none;
            margin-top: 22px;
            text-align: center;
        }

        .load-more-wrap .sys-btn {
            margin: 0 4px;
        }

        #load-all-btn {
            font-size: 0.75rem;
            padding: 6px 10px;
        }

        .retry-wrap {
            display: none;
            margin: 16px 0 8px;
            text-align: center;
        }

        .footer-note {
            margin: 28px 0 0;
            padding-top: 12px;
            border-top: 1px solid #999;
            font-size: 0.7rem;
            line-height: 1.5;
            color: #555;
        }

        .footer-note a {
            color: black;
        }

        @media (max-width: 560px) {
            body {
                padding: 8px;
            }

            .window {
                height: 95vh;
            }

            .window-content {
                padding: 18px 16px 24px;
            }

            .page-head {
                display: block;
            }

            .github-link {
                display: inline-block;
                margin: 10px 0 0 0;
            }

            h1 {
                font-size: 1.3rem;
            }
        }
    </style>
</head>

<body>
    <div class="window">
        <div class="title-bar">
            <div class="title-stripes"></div>
            <div class="close-box" onclick="window.location.href='index'" data-i18n="battleship.btn.close">X</div>
            <span class="title-text" data-i18n="changelog.title">Changelog</span>
        </div>

        <div class="window-content">
            <div class="page-head">
                <div class="head-text">
                    <h1 data-i18n="changelog.title">Changelog</h1>
                    <p class="subtitle" data-i18n="changelog.subtitle">Every commit to ReKindle, newest first.</p>
                </div>
                <a class="github-link" href="https://github.com/ReKindleOS/ReKindle/commits" target="_blank"
                    rel="noopener noreferrer" data-i18n="changelog.btn.github">GitHub</a>
            </div>

            <div class="toolbar">
                <input id="commit-filter" type="text" autocomplete="off" autocapitalize="off" spellcheck="false"
                    placeholder="Filter commits..." data-i18n-placeholder="changelog.placeholder.filter">
                <button id="refresh-btn" type="button" class="sys-btn" onclick="rekindleChangelog.refresh()"
                    data-i18n="changelog.btn.refresh">Refresh</button>
            </div>

            <div id="status" class="status" role="status" aria-live="polite"
                data-i18n="changelog.status.loading">Loading commits...</div>

            <div class="retry-wrap" id="retry-wrap">
                <button type="button" class="sys-btn" onclick="rekindleChangelog.retry()"
                    data-i18n="changelog.btn.retry">Retry</button>
            </div>

            <div id="commit-list" class="commit-list" role="list"></div>
            <div id="empty-state" class="empty-state" style="display:none;"></div>

            <div class="load-more-wrap" id="load-more-wrap">
                <button id="load-more-btn" type="button" class="sys-btn"
                    onclick="rekindleChangelog.loadMore()" data-i18n="changelog.btn.load_more">Load older commits</button>
                <button id="load-all-btn" type="button" class="sys-btn"
                    onclick="rekindleChangelog.loadAll()" data-i18n="changelog.btn.load_all">Load all</button>
            </div>

            <p class="footer-note" data-i18n="changelog.footer">
                Commits are read from the public GitHub API and cached for up to an hour.
            </p>
        </div>
    </div>

    <script>
        (function () {
            'use strict';

            var API = '/api/commits';
            var PER_PAGE = 100;
            var MAX_AUTO_PAGES = 50; // stops a runaway loop if GitHub's paging ever breaks

            var MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun',
                'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

            var state = {
                page: 0,
                totalPages: 1,
                commits: [],
                loading: false,
                loadingMode: 'initial',
                loadedAll: false,
                error: '',
                filter: ''
            };

            var requestToken = 0;
            var filterTimer = null;
            var els = {};

            function $(id) {
                return document.getElementById(id);
            }

            function tr(key, fallback) {
                if (typeof window.t === 'function') return window.t(key, fallback);
                return fallback;
            }

            function trf(key, vars, fallback) {
                if (typeof window.tFormat === 'function') return window.tFormat(key, vars, fallback);
                var text = fallback;
                if (!vars) return text;
                for (var name in vars) {
                    if (Object.prototype.hasOwnProperty.call(vars, name)) {
                        text = text.split('${' + name + '}').join(String(vars[name]));
                    }
                }
                return text;
            }

            function parseDate(iso) {
                if (typeof iso !== 'string' || iso.length < 10) return null;

                var year = parseInt(iso.slice(0, 4), 10);
                var month = parseInt(iso.slice(5, 7), 10);
                var day = parseInt(iso.slice(8, 10), 10);

                if (!isFinite(year) || !isFinite(month) || !isFinite(day)) return null;
                if (month < 1 || month > 12) return null;

                return {
                    key: iso.slice(0, 10),
                    label: MONTHS[month - 1] + ' ' + day + ', ' + year,
                    time: iso.length >= 16 ? iso.slice(11, 16) + ' UTC' : ''
                };
            }

            function matchesFilter(commit) {
                if (!state.filter) return true;
                var haystack = (commit.message + ' ' + commit.author + ' ' +
                    commit.short + ' ' + commit.sha).toLowerCase();
                return haystack.indexOf(state.filter) !== -1;
            }

            function filteredCommits() {
                if (!state.filter) return state.commits;
                var out = [];
                for (var i = 0; i < state.commits.length; i++) {
                    if (matchesFilter(state.commits[i])) out.push(state.commits[i]);
                }
                return out;
            }

            function fetchPage(page) {
                var url = API + '?page=' + page + '&per_page=' + PER_PAGE;

                return fetch(url, {
                    method: 'GET',
                    cache: 'no-store',
                    headers: { 'Accept': 'application/json' }
                }).then(function (response) {
                    return response.json().catch(function () { return null; }).then(function (data) {
                        if (!response.ok) {
                            var err = new Error((data && data.message) || ('HTTP ' + response.status));
                            err.code = (data && data.error) || 'error';
                            throw err;
                        }
                        if (!data || !Array.isArray(data.commits)) {
                            var invalid = new Error('Invalid response');
                            invalid.code = 'error';
                            throw invalid;
                        }
                        return data;
                    });
                });
            }

            function applyResponse(data) {
                var incoming = data.commits || [];
                state.commits = state.commits.concat(incoming);
                state.page = typeof data.page === 'number' ? data.page : state.page + 1;
                if (typeof data.totalPages === 'number' && data.totalPages > 0) {
                    state.totalPages = data.totalPages;
                } else if (data.hasMore) {
                    state.totalPages = Math.max(state.totalPages, state.page + 1);
                } else {
                    state.totalPages = Math.max(1, state.page);
                }
                state.loadedAll = !data.hasMore;
            }

            function loadInitial() {
                if (state.loading) return;

                requestToken++;
                var token = requestToken;

                state.loading = true;
                state.loadingMode = 'initial';
                state.error = '';
                state.page = 0;
                state.totalPages = 1;
                state.commits = [];
                state.loadedAll = false;

                render();

                fetchPage(1).then(function (data) {
                    if (token !== requestToken) return;
                    state.loading = false;
                    applyResponse(data);
                    render();
                }).catch(function (err) {
                    if (token !== requestToken) return;
                    state.loading = false;
                    state.error = (err && err.code) || 'error';
                    render();
                });
            }

            function loadMore() {
                if (state.loading || state.loadedAll) return;

                state.loading = true;
                state.loadingMode = 'more';
                state.error = '';
                updateStatus();

                fetchPage(state.page + 1).then(function (data) {
                    state.loading = false;
                    applyResponse(data);
                    render();
                }).catch(function (err) {
                    state.loading = false;
                    state.error = (err && err.code) || 'error';
                    render();
                });
            }

            function loadAll() {
                if (state.loading || state.loadedAll) return;

                state.loading = true;
                state.loadingMode = 'all';
                state.error = '';
                updateStatus();

                var pagesFetched = 0;

                function step() {
                    if (state.loadedAll || pagesFetched >= MAX_AUTO_PAGES) {
                        state.loading = false;
                        render();
                        return;
                    }

                    fetchPage(state.page + 1).then(function (data) {
                        applyResponse(data);
                        pagesFetched++;

                        if (state.loadedAll) {
                            state.loading = false;
                            render();
                            return;
                        }

                        // Update the count while older pages are still arriving,
                        // without rebuilding hundreds of rows on every page.
                        updateStatus();
                        step();
                    }).catch(function (err) {
                        state.loading = false;
                        state.error = (err && err.code) || 'error';
                        render();
                    });
                }

                step();
            }

            function refresh() {
                if (state.loading) return;
                loadInitial();
            }

            function retry() {
                if (state.loading) return;
                if (state.commits.length === 0) {
                    loadInitial();
                } else {
                    loadMore();
                }
            }

            function updateStatus() {
                var matched = filteredCommits().length;

                if (state.error) {
                    els.status.textContent = state.error === 'rate_limited'
                        ? tr('changelog.status.rate_limited', 'GitHub is rate-limiting requests. Try again in a few minutes.')
                        : tr('changelog.status.error', 'Could not load commits from GitHub.');
                    els.retryWrap.style.display = 'block';
                    return;
                }

                els.retryWrap.style.display = 'none';

                if (state.loading) {
                    if (state.commits.length === 0) {
                        els.status.textContent = tr('changelog.status.loading', 'Loading commits...');
                    } else if (state.loadingMode === 'more') {
                        els.status.textContent = tr('changelog.status.loading_more', 'Loading older commits...');
                    } else {
                        els.status.textContent = trf('changelog.status.loading_all',
                            { page: Math.min(state.totalPages, state.page + 1), total: state.totalPages },
                            'Loading commits - page ${page} of ${total}...');
                    }
                    return;
                }

                if (state.filter) {
                    els.status.textContent = trf('changelog.status.filter',
                        { matched: matched, shown: state.commits.length },
                        '${matched} of ${shown} loaded commits match.');
                    return;
                }

                if (state.commits.length === 0) {
                    els.status.textContent = tr('changelog.status.none_loaded', '0 commits loaded.');
                    return;
                }

                if (state.loadedAll) {
                    els.status.textContent = trf('changelog.status.all',
                        { shown: state.commits.length },
                        'All ${shown} commits loaded.');
                    return;
                }

                els.status.textContent = trf('changelog.status.loaded', {
                    shown: state.commits.length,
                    page: state.page,
                    total: state.totalPages
                }, '${shown} commits loaded - page ${page} of ${total}.');
            }

            function updateControls() {
                var canLoad = !state.loading && !state.loadedAll && state.commits.length > 0;

                els.loadMoreWrap.style.display = canLoad ? 'block' : 'none';
                els.loadMoreBtn.disabled = state.loading;
                els.loadAllBtn.disabled = state.loading;

                var remainingPages = state.totalPages - state.page;
                els.loadAllBtn.style.display = (canLoad && remainingPages > 1) ? 'inline-block' : 'none';

                els.refreshBtn.disabled = state.loading;
            }

            function buildCommitRow(commit, parts) {
                var article = document.createElement('article');
                article.className = 'commit';
                article.setAttribute('role', 'listitem');

                var link = document.createElement('a');
                link.className = 'commit-msg';
                link.href = commit.url;
                link.target = '_blank';
                link.rel = 'noopener noreferrer';
                link.textContent = commit.message || '(no message)';
                if (commit.sha) link.title = commit.sha;
                article.appendChild(link);

                var meta = document.createElement('div');
                meta.className = 'commit-meta';

                var author = document.createElement('span');
                author.className = 'meta-item';
                author.textContent = commit.author || 'Unknown';
                meta.appendChild(author);

                if (commit.short) {
                    var sha = document.createElement('span');
                    sha.className = 'meta-item commit-sha';
                    sha.textContent = commit.short;
                    meta.appendChild(sha);
                }

                if (parts && parts.time) {
                    var time = document.createElement('span');
                    time.className = 'meta-item';
                    time.textContent = parts.time;
                    meta.appendChild(time);
                }

                article.appendChild(meta);
                return article;
            }

            function render() {
                var list = els.list;
                var fragment = document.createDocumentFragment();
                var items = filteredCommits();

                while (list.firstChild) list.removeChild(list.firstChild);

                if (items.length) {
                    var currentGroup = null;
                    var currentRows = null;
                    var currentKey = '';

                    for (var i = 0; i < items.length; i++) {
                        var parts = parseDate(items[i].date);
                        var key = parts ? parts.key : 'unknown';

                        if (!currentRows || key !== currentKey) {
                            currentKey = key;

                            currentGroup = document.createElement('section');
                            currentGroup.className = 'commit-group';

                            var heading = document.createElement('h2');
                            heading.className = 'commit-date';
                            heading.textContent = parts ? parts.label : 'Unknown date';
                            currentGroup.appendChild(heading);

                            currentRows = document.createElement('div');
                            currentRows.className = 'commit-rows';
                            currentGroup.appendChild(currentRows);

                            fragment.appendChild(currentGroup);
                        }

                        currentRows.appendChild(buildCommitRow(items[i], parts));
                    }

                    list.appendChild(fragment);
                }

                els.empty.style.display = (!items.length && !state.loading && !state.error) ? 'block' : 'none';
                if (!items.length && !state.loading && !state.error) {
                    els.empty.textContent = state.filter
                        ? tr('changelog.status.no_match', 'No loaded commits match that filter.')
                        : tr('changelog.status.empty', 'No commits found.');
                }

                updateStatus();
                updateControls();
            }

            function onFilterInput() {
                if (filterTimer) clearTimeout(filterTimer);

                filterTimer = setTimeout(function () {
                    state.filter = els.filter.value.trim().toLowerCase();
                    render();
                }, 180);
            }

            function init() {
                els.list = $('commit-list');
                els.empty = $('empty-state');
                els.status = $('status');
                els.retryWrap = $('retry-wrap');
                els.loadMoreWrap = $('load-more-wrap');
                els.loadMoreBtn = $('load-more-btn');
                els.loadAllBtn = $('load-all-btn');
                els.refreshBtn = $('refresh-btn');
                els.filter = $('commit-filter');

                els.filter.addEventListener('input', onFilterInput);

                // Dynamic status text is rendered from JS, so refresh it when the
                // async locale files arrive (static data-i18n labels update themselves).
                if (window.rekindleI18nReady) {
                    render();
                } else {
                    document.addEventListener('rekindle:i18n:ready', function () {
                        render();
                    });
                }

                loadInitial();
            }

            window.rekindleChangelog = {
                refresh: refresh,
                retry: retry,
                loadMore: loadMore,
                loadAll: loadAll
            };

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }

            window.addEventListener('load', function () {
                if (window.rekindleApplyWallpaper) window.rekindleApplyWallpaper();
            });
        })();
    </script>
</body>

</html>
