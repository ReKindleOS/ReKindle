name: Build and Deploy

on:
  push:
    branches: [ main ] # Ensure this matches your branch name (e.g. 'main' or 'master')
  workflow_dispatch: # Allows manual runs from the Actions tab

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          # sitemap.xml <lastmod> comes from each file's last commit date, so the
          # build needs real history. actions/checkout defaults to a depth-1
          # clone, where every file looks like it changed in the same commit and
          # every lastmod would be "today" - exactly the signal Google ignores.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22 # Matches the Cloud Functions runtime; Node 20 is EOL (2026-04-30)

      - name: Install dependencies
        run: npm ci

      - name: Static audit + unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify deploy targets contain no secrets
        run: |
          node scripts/deploy-guard.js _deploy/main
          node scripts/deploy-guard.js _deploy/lite
          node scripts/deploy-guard.js _deploy/legacy

      - name: Verify service-worker cache stamp
        run: |
          STAMP="rekindle-cache-${GITHUB_SHA:0:7}-${GITHUB_RUN_ID}"
          for DIR in _deploy/main _deploy/lite _deploy/legacy; do
            grep -q "$STAMP" "$DIR/sw.js" || { echo "::error::$DIR/sw.js is missing $STAMP"; exit 1; }
          done
          echo "Service-worker cache stamped: $STAMP"

      # NOTE: cloudflare/pages-action was deprecated and removed on 2026-09-18
      # (CVE-2026-11325), so GitHub can no longer resolve it. Cloudflare's
      # recommended replacement is cloudflare/wrangler-action.
      - name: Publish Main
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
          command: pages deploy _deploy/main --project-name=rekindle --branch=${{ github.ref_name }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      # Deploy LITE Site to the 'rekindle-lite' project
      - name: Publish Lite
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
          command: pages deploy _deploy/lite --project-name=rekindle-lite --branch=${{ github.ref_name }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      # Deploy LEGACY Site to the 'rekindle-legacy' project
      - name: Publish Legacy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
          command: pages deploy _deploy/legacy --project-name=rekindle-legacy --branch=${{ github.ref_name }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      # Best-effort edge-cache purge. The build already stamps a unique
      # service-worker CACHE_NAME; this additionally clears stale Pages assets
      # when the API token has Zone -> Cache Purge permission. Missing scopes
      # or a missing token only emit a warning, never fail the deployment.
      - name: Purge Cloudflare edge cache
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CF_API_TOKEN" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN is not set; skipping edge cache purge."
            exit 0
          fi
          ZONE_JSON=$(curl -sS -H "Authorization: Bearer $CF_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/zones?name=rekindle.ink")
          ZONE_ID=$(printf '%s' "$ZONE_JSON" | jq -r '.result[0].id // empty')
          if [ -z "$ZONE_ID" ]; then
            echo "::warning::Could not resolve the rekindle.ink zone; skipping edge cache purge."
            exit 0
          fi
          STATUS=$(curl -sS -o /tmp/cf-purge.json -w "%{http_code}" \
            -X POST -H "Authorization: Bearer $CF_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}' \
            "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/purge_cache")
          if [ "$STATUS" = "200" ]; then
            echo "Cloudflare edge cache purged."
          else
            echo "::warning::Cloudflare edge cache purge failed ($STATUS): $(cat /tmp/cf-purge.json)"
          fi
