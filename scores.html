    <style>
        /* SYSTEM 7 AESTHETICS */
        :root {
            --bg-color: #ffffff;
            --text-color: #000000;
            --border: 2px solid #000000;
            --shadow: 4px 4px 0px #000000;
            --stripe-pattern: repeating-linear-gradient(0deg, transparent, transparent 2px, #000 3px, #000 4px);
        }

        body {
            image-rendering: -webkit-crisp-edges;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            background-repeat: repeat;
            background-position: top left;
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 20px;
            height: 100vh;
            overflow: hidden;
            background-color: #e5e5e5;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            user-select: none;
            box-sizing: border-box;
        }

        /* WINDOW FRAME */
        .window {
            background: white;
            border: 2px solid black;
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            min-height: 90vh;
            width: 100%;
            max-width: 600px;
            position: relative;
        }

        /* TITLE BAR */
        .title-bar {
            height: 35px;
            border-bottom: 2px solid black;
            display: flex;
            align-items: center;
            justify-content: center;
            background: white;
            padding: 0 10px;
            position: relative;
            flex-shrink: 0;
        }

        .title-stripes {
            position: absolute;
            top: 4px;
            bottom: 4px;
            left: 4px;
            right: 4px;
            background-image: var(--stripe-pattern);
            z-index: 0;
        }

        .title-text {
            background: white;
            padding: 0 15px;
            font-weight: bold;
            z-index: 1;
            font-size: 1.1rem;
            display: inline-flex;
            align-items: center;
            height: 100%;
            box-sizing: border-box;
        }

        .header-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 24px;
            height: 24px;
            border: 2px solid black;
            background: white;
            z-index: 2;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            box-shadow: 2px 2px 0 black;
            font-family: sans-serif;
            font-size: 0.9rem;
        }

        .header-btn:active {
            transform: translateY(-50%) translate(1px, 1px);
            box-shadow: none;
        }

        .close-box {
            left: 10px;
        }

        .refresh-btn {
            right: 10px;
        }

        .back-btn {
            left: 10px;
            display: none;
        }

        /* Hidden by default */

        /* CONTENT AREA */
        .window-content {
            flex-grow: 1;
            overflow-y: auto;
            padding: 0;
            background: white;
            display: flex;
            flex-direction: column;
        }

        /* TOP TABS (VIEW SWITCHER) */
        .top-tabs {
            display: flex;
            border-bottom: 2px solid black;
            background: #e5e5e5;
            flex-shrink: 0;
        }

        .top-tab-btn {
            flex: 1;
            padding: 9px;
            text-align: center;
            font-weight: 900;
            border: none;
            background: #e5e5e5;
            border-right: 2px solid #000;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.78rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .top-tab-btn:last-child {
            border-right: none;
        }

        .top-tab-btn.active {
            background: #000;
            color: #fff;
        }

        /* LEAGUE LIST (MENU) */
        .league-menu {
            display: flex;
            flex-direction: column;
            padding: 12px;
        }

        .league-menu>*+* {
            margin-top: 10px;
        }

        /* Sports menu is a two-column grid; grid gap is safe on Chromium 75. */
        .league-menu.sports-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .league-menu.sports-grid>*+* {
            margin-top: 0;
        }

        .league-count {
            margin-left: 8px;
            font-size: 0.75rem;
            font-weight: normal;
            color: #666;
        }

        .league-btn {
            border: 2px solid black;
            padding: 12px;
            background: white;
            font-family: inherit;
            font-weight: bold;
            font-size: 0.95rem;
            text-align: left;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 3px 3px 0 #000;
        }

        .league-btn:hover {
            background: #f4f4f4;
        }

        .league-btn:active {
            background: black;
            color: white;
            box-shadow: none;
            transform: translate(2px, 2px);
        }

        .league-btn:active .arrow {
            border-color: white;
            /* Invert arrow on active */
        }

        .arrow {
            width: 10px;
            height: 10px;
            border-top: 2px solid black;
            border-right: 2px solid black;
            transform: rotate(45deg);
            margin-right: 10px;
        }

        /* GAMES LIST */
        #scores-view {
            display: none;
            flex-direction: column;
            padding: 10px;
        }

        /* Chromium 75 has no flexbox gap. */
        #scores-view > * + * {
            margin-top: 10px;
        }

        #game-container {
            display: flex;
            flex-direction: column;
        }

        #game-container>*+* {
            margin-top: 15px;
        }

        .game-card {
            border: 2px solid black;
            padding: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: relative;
            background: white;
            box-shadow: 2px 2px 0 #000;
        }

        .game-status {
            position: absolute;
            top: 0;
            left: 0;
            background: black;
            color: white;
            font-size: 0.7rem;
            padding: 2px 6px;
            font-weight: bold;
        }

        .game-status.live {
            background: #000;
            text-decoration: underline;
        }

        .teams {
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            margin-top: 10px;
        }

        .teams>*+* {
            margin-top: 5px;
        }

        .team-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 1.1rem;
        }

        .team-info {
            display: flex;
            align-items: center;
        }

        .team-info>*+* {
            margin-left: 8px;
        }

        .team-name {
            font-weight: bold;
        }

        .winner {
            text-decoration: underline;
        }

        .team-logo {
            width: 20px;
            height: 20px;
            object-fit: contain;
        }

        .fav-star {
            font-size: 1.2rem;
            cursor: pointer;
            color: #ccc;
            line-height: 1;
            margin-right: 5px;
            -webkit-text-stroke: 1px black;
            position: relative;
            z-index: 10;
        }

        .fav-star.active {
            color: black;
            -webkit-text-stroke: 0;
        }

        .fav-star:hover {
            opacity: 0.7;
        }

        .score {
            font-weight: 900;
            font-size: 1.3rem;
        }

        .loading-msg {
            text-align: center;
            padding: 20px;
            font-style: italic;
            color: #666;
        }

        .section-header {
            padding: 10px 10px 0 10px;
            font-weight: 900;
            font-size: 0.9rem;
            text-transform: uppercase;
            border-bottom: 2px solid black;
            margin-bottom: 5px;
            background: #eee;
            display: flex;
            justify-content: space-between;
            align-items: center;
            min-height: 30px;
            height: auto;
        }

        #league-name-display {
            overflow-wrap: break-word;
        }
    </style>

            { name: "NCAA Men's Lacrosse", slug: "lacrosse/mens-college-lacrosse", group: "Lacrosse" },
            { name: "NCAA Women's Lacrosse", slug: "lacrosse/womens-college-lacrosse", group: "Lacrosse" },
            { name: "NLL", slug: "lacrosse/nll", group: "Lacrosse" },
            { name: "Premier Lacrosse League", slug: "lacrosse/pll", group: "Lacrosse" },
            { name: "NCAA Men's Volleyball", slug: "volleyball/mens-college-volleyball", group: "Volleyball" },
            { name: "NCAA Women's Volleyball", slug: "volleyball/womens-college-volleyball", group: "Volleyball" },
            { name: "NCAA Field Hockey", slug: "field-hockey/womens-college-field-hockey", group: "Field Hockey" },
            { name: "NCAA Men's Water Polo", slug: "water-polo/mens-college-water-polo", group: "Water Polo" },
            { name: "NCAA Women's Water Polo", slug: "water-polo/womens-college-water-polo", group: "Water Polo" },
        ];

        // --- STATE ---
        let currentMode = 'menu'; // 'menu' or 'scores'
        let menuLevel = 'sports'; // 'sports' (group list) or 'leagues'
        let currentTab = 'all';   // 'all' or 'favs'
        let activeGroup = null;
        let activeLeague = null;
        const EVENT_WINDOW_MS = 60 * 24 * 60 * 60 * 1000;

        // Out-of-season leagues otherwise show a final from months (or years)
        // ago. Keep live/upcoming games and results from the last two months.
        function isCurrentEvent(event) {
            if (!event || !event.date) return true;
            const when = Date.parse(event.date);
            if (isNaN(when)) return true;
            return Math.abs(Date.now() - when) <= EVENT_WINDOW_MS;
        }

        // Favorites: { 'leagueSlug:teamId': { id, name, league } }
        // ESPN team ids are only unique inside one sport (NFL id 2 = BUF,
        // NBA id 2 = BOS), so the league must be part of the key.
        let favoriteTeams = loadFavorites();

        function loadFavorites() {
            let stored = {};
            try {
                stored = JSON.parse(localStorage.getItem('rekindle_scores_favs')) || {};
            } catch (e) {
                stored = {};
            }

            const favs = {};
            Object.keys(stored).forEach(function (key) {
                const fav = stored[key];
                if (!fav || !fav.id || !fav.league) return;
                // Old entries were keyed by team id alone; re-key them here.
                favs[favoriteKey(fav.league, fav.id)] = fav;
            });
            return favs;
        }

        function favoriteKey(leagueSlug, teamId) {
            return String(leagueSlug) + ':' + String(teamId);
        }

        window.onload = () => {
            if (window.rekindleApplyWallpaper) window.rekindleApplyWallpaper();
            switchTab('all');
        };

        // --- NAVIGATION ---
        function switchTab(tab) {
            currentTab = tab;

            // Toggle Tab UI
            document.getElementById('tab-all').className = tab === 'all' ? 'top-tab-btn active' : 'top-tab-btn';
            document.getElementById('tab-favs').className = tab === 'favs' ? 'top-tab-btn active' : 'top-tab-btn';

            if (tab === 'all') {
                // Show Menu
                resetToMenu();
            } else {
                // Show Favorites Feed
                showFavoritesView();
            }
        }

        function resetToMenu() {
            currentMode = 'menu';
            menuLevel = 'sports';
            activeGroup = null;
            activeLeague = null;

            document.getElementById('app-title').innerText = window.t('app.scores.name', 'Scores');
            document.getElementById('menu-view').style.display = 'block';
            document.getElementById('scores-view').style.display = 'none';

            // Buttons
            document.getElementById('btn-close').style.display = 'flex';
            document.getElementById('btn-back').style.display = 'none';

            renderMenu();
        }

        function openGroup(groupName) {
            currentMode = 'menu';
            menuLevel = 'leagues';
            activeGroup = groupName;
            activeLeague = null;
            currentTab = 'all';

            document.getElementById('tab-all').className = 'top-tab-btn active';
            document.getElementById('tab-favs').className = 'top-tab-btn';
            document.getElementById('app-title').innerText = groupName;
            document.getElementById('menu-view').style.display = 'block';
            document.getElementById('scores-view').style.display = 'none';

            document.getElementById('btn-close').style.display = 'none';
            document.getElementById('btn-back').style.display = 'flex';

            renderMenu();
        }

        function showFavoritesView() {
            currentMode = 'scores'; // technically viewing scores
            activeLeague = null; // purely mixed

            document.getElementById('app-title').innerText = window.t('scores.tab.fav', 'Favorites');
            document.getElementById('menu-view').style.display = 'none';
            document.getElementById('scores-view').style.display = 'flex';

            // Allow going back? No, tab switching handles it. 
            // Close button should be active as this is a top-level view.
            document.getElementById('btn-close').style.display = 'flex';
            document.getElementById('btn-back').style.display = 'none';

            // Hide League Header in Fav View (or change text)
            document.getElementById('scores-header').style.display = 'none';
            // document.getElementById('league-nav').style.display = 'none'; // This element doesn't exist

            fetchFavorites();
        }

        function openLeague(leagueData) {
            activeLeague = leagueData;
            currentMode = 'scores';
            currentTab = 'all'; // Implicitly we are in All

            // UI Updates
            document.getElementById('app-title').innerText = leagueData.name;
            document.getElementById('menu-view').style.display = 'none';
            document.getElementById('scores-view').style.display = 'flex';

            // Show Back Button
            document.getElementById('btn-close').style.display = 'none';
            document.getElementById('btn-back').style.display = 'flex';

            // Header
            document.getElementById('scores-header').style.display = 'flex';
            document.getElementById('league-name-display').innerText = `${leagueData.name}`;

            fetchLeagueScores();
        }

        function goBack() {
            if (currentMode === 'scores') {
                if (currentTab === 'favs') {
                    switchTab('all');
                    return;
                }
                if (activeGroup) {
                    openGroup(activeGroup);
                    return;
                }
            }
            resetToMenu();
        }

        function refreshCurrent() {
            if (currentTab === 'favs') {
                fetchFavorites();
            } else if (currentMode === 'scores' && activeLeague) {
                fetchLeagueScores();
            } else {
                // Menu refresh?
                renderMenu();
            }
        }

        // --- RENDERERS ---
        function getGroups() {
            const groups = [];
            LEAGUES.forEach(function (league) {
                const name = league.group || 'Other';
                let group = groups.find(function (g) { return g.name === name; });
                if (!group) {
                    group = { name: name, leagues: [] };
                    groups.push(group);
                }
                group.leagues.push(league);
            });
            return groups;
        }

        function renderMenu() {
            const container = document.getElementById('menu-list');
            container.innerHTML = '';

            if (menuLevel === 'leagues') {
                container.className = 'league-menu';
                LEAGUES.filter(function (league) {
                    return league.group === activeGroup;
                }).forEach(function (league) {
                    const btn = document.createElement('div');
                    btn.className = 'league-btn';
                    btn.innerHTML = `
                        <span>${escapeHtml(league.name)}</span>
                        <div class="arrow"></div>
                    `;
                    btn.onclick = function () { openLeague(league); };
                    container.appendChild(btn);
                });
                return;
            }

            container.className = 'league-menu sports-grid';
            getGroups().forEach(function (group) {
                const btn = document.createElement('div');
                btn.className = 'league-btn';
                btn.innerHTML = `
                    <span>${escapeHtml(group.name)}<span class="league-count">${group.leagues.length}</span></span>
                    <div class="arrow"></div>
                `;
                btn.onclick = function () { openGroup(group.name); };
                container.appendChild(btn);
            });
        }

        // --- DATA LOGIC ---

        async function fetchLeagueScores() {
            const container = document.getElementById('game-container');
            container.innerHTML = `<div class="loading-msg">${window.t('scores.status.loading', 'Loading scores...')}</div>`;

            try {
                const data = await fetchFromAPI(activeLeague.slug);
                renderGames((data.events || []).filter(isCurrentEvent), container);
            } catch (e) {
                console.error(e);
                container.innerHTML = `<div class="loading-msg" style="color:red;">${window.t('scores.error.loading', 'Error loading data.')}</div>`;
            }
        }

        async function fetchFavorites() {
            const container = document.getElementById('game-container');
            container.innerHTML = `<div class="loading-msg">${window.t('scores.status.loading_fav', 'Loading favorites...')}</div>`;

            // Identify leagues
            const leaguesToFetch = new Set();
            Object.values(favoriteTeams).forEach(t => {
                if (t.league) leaguesToFetch.add(t.league);
            });

            if (leaguesToFetch.size === 0) {
                container.innerHTML = `
                    <div class="loading-msg">
                        ${window.t('scores.status.no_fav', 'No favorite teams yet.')}<br><br>
                        <small>${window.t('scores.status.no_fav_desc', 'Go to "All Sports", select a league, and star your teams!')}</small>
                    </div>
                `;
                return;
            }

            try {
                // Fetch all unique leagues, keeping the slug with each payload so
                // a favorite can be matched inside the correct sport.
                const promises = Array.from(leaguesToFetch).map(slug =>
                    fetchFromAPI(slug).then(data => ({ slug: slug, data: data }))
                );
                const results = await Promise.all(promises);

                let allEvents = [];
                results.forEach(result => {
                    (result.data.events || []).forEach(event => {
                        if (!isCurrentEvent(event)) return;
                        event._leagueSlug = result.slug;
                        allEvents.push(event);
                    });
                });

                // Filter matches with favorites
                const favEvents = allEvents.filter(event => {
                    const comp = event.competitions[0];
                    return comp.competitors.some(c =>
                        !!favoriteTeams[favoriteKey(event._leagueSlug, c.team.id)]
                    );
                });

                if (favEvents.length === 0) {
                    container.innerHTML = `<div class="loading-msg">${window.t('scores.status.no_games_fav', 'No games scheduled for your favorite teams.')}</div>`;
                } else {
                    // Sort by time? API usually sorts by time.
                    renderGames(favEvents, container);
                }

            } catch (e) {
                console.error(e);
                container.innerHTML = `<div class="loading-msg" style="color:red;">${window.t('scores.error.fav', 'Error loading favorites.')}</div>`;
            }
        }

        async function fetchFromAPI(leagueSlug) {
            const league = LEAGUES.find(l => l.slug === leagueSlug);

            if (league && league.source === 'nrl-scores') {
                const res = await fetch('/api/nrl-scores');
                if (!res.ok) {
                    throw new Error("Network error " + res.status);
                }
                return await res.json();
            }

            // ESPN's scoreboard API sends `access-control-allow-origin: *`, so the
            // browser can call it directly. Do NOT route it through /api/proxy:
            // ESPN's CDN answers Cloudflare Pages egress with 403 "Access Denied"
            // (2026-11-17), which broke every league except NRL, and a proxied call
            // would spend a Pages Function invocation for no benefit.
            const apiUrl = `https://site.api.espn.com/apis/site/v2/sports/${leagueSlug}/scoreboard`;
            const res = await fetch(apiUrl);

            if (!res.ok) {
                throw new Error("Network error " + res.status);
            }

            return await res.json();
        }

        function renderGames(events, container) {
            container.innerHTML = '';

            if (events.length === 0) {
                container.innerHTML = `<div class="loading-msg">${window.t('scores.status.no_games', 'No games scheduled.')}</div>`;
                return;
            }

            events.forEach(event => {
                if (!event || !event.competitions || !event.competitions[0]) return;
                const competition = event.competitions[0];
                const competitors = competition.competitors || [];
                const homeComp = competitors.find(c => c.homeAway === 'home');
                const awayComp = competitors.find(c => c.homeAway === 'away');
                if (!homeComp || !awayComp || !homeComp.team || !awayComp.team) return;

                const statusType = (event.status && event.status.type) || {};
                const status = statusType.state || 'pre';
                const statusDetail = statusType.shortDetail || '';
                // Favorites events carry their league; a single-league view knows it.
                const leagueSlug = event._leagueSlug || (activeLeague ? activeLeague.slug : '');

                const home = homeComp.team;
                const away = awayComp.team;

                // Winner Logic
                const homeClass = (status === 'post' && parseInt(homeComp.score) > parseInt(awayComp.score)) ? 'team-name winner' : 'team-name';
                const awayClass = (status === 'post' && parseInt(awayComp.score) > parseInt(homeComp.score)) ? 'team-name winner' : 'team-name';

                // Status Badge
                let statusBadge = '';
                if (status === 'in') {
                    statusBadge = `<div class="game-status live">${escapeHtml(statusDetail)}</div>`;
                } else {
                    statusBadge = `<div class="game-status">${escapeHtml(statusDetail)}</div>`;
                }

                const card = document.createElement('div');
                card.className = 'game-card';
                const showScore = status !== 'pre';

                card.innerHTML = `
                    ${statusBadge}
                    <div class="teams">
                        ${renderTeamRow(awayComp, awayClass, away.id, leagueSlug, showScore)}
                        ${renderTeamRow(homeComp, homeClass, home.id, leagueSlug, showScore)}
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function renderTeamRow(comp, nameClass, teamId, leagueSlug, showScore) {
            const team = comp.team || {};
            const label = team.abbreviation || team.shortDisplayName || 'TBD';
            const isFav = !!favoriteTeams[favoriteKey(leagueSlug, teamId)];
            const starChar = isFav ? '★' : '☆';
            const starClass = isFav ? 'fav-star active' : 'fav-star';
            const logo = team.logo
                ? `<img src="${escapeHtml(team.logo)}" class="team-logo" onerror="this.style.display='none'">`
                : '';

            return `
                <div class="team-row">
                    <div class="team-info">
                        <span class="${starClass}" onclick="toggleFavorite(event, '${escapeQuote(leagueSlug)}', '${escapeQuote(teamId)}', '${escapeQuote(team.shortDisplayName || label)}')">${starChar}</span>
                        <div class="${nameClass}">
                            ${logo}
                            ${escapeHtml(label)}
                        </div>
                    </div>
                    <div class="score">${showScore ? escapeHtml(comp.score == null ? '' : comp.score) : ''}</div>
                </div>
            `;
        }

        // --- FAVORITES ACTION ---
        function toggleFavorite(event, leagueSlug, teamId, teamName) {
            if (event) event.stopPropagation();

            const key = favoriteKey(leagueSlug, teamId);
            if (favoriteTeams[key]) {
                delete favoriteTeams[key];
            } else if (leagueSlug) {
                favoriteTeams[key] = {
                    id: teamId,
                    name: teamName,
                    league: leagueSlug
                };
            }

            localStorage.setItem('rekindle_scores_favs', JSON.stringify(favoriteTeams));

            // Refresh
            refreshCurrent();
        }

        function escapeHtml(text) {
            if (text == null) return "";
            return String(text).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }
        function escapeQuote(str) {
            var json = JSON.stringify(String(str == null ? '' : str));
            return escapeHtml(json.slice(1, -1));
        }


    </script>
