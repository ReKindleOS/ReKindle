<head>

    <title>Translator – Ten languages, auto-detect | ReKindle</title>
    <style>
        /* SYSTEM 7 AESTHETICS */
        :root {
            --bg-color: #ffffff;
            --text-color: #000000;
            --border: 2px solid #000000;
            --shadow: 4px 4px 0px #000000;
            --stripe-pattern: repeating-linear-gradient(0deg, transparent, transparent 2px, #000 3px, #000 4px);
        }

        body {
            image-rendering: -webkit-crisp-edges;
            image-rendering: -moz-crisp-edges;
            image-rendering: -o-crisp-edges;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            -ms-interpolation-mode: nearest-neighbor;
            background-repeat: repeat;
            background-position: top left;

            image-rendering: -webkit-optimize-contrast;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            background-repeat: repeat;
            background-position: top left;

            image-rendering: pixelated;
            image-rendering: crisp-edges;
            background-repeat: repeat;
            background-position: top left;

            font-family: "Geneva", "Verdana", sans-serif;
            margin: 0;
            padding: 20px;
            height: 100vh;
            overflow: hidden;
            background-color: #e5e5e5;
            /* Default Background (Overridden by JS) */
            /* Background managed by settings */

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            /* FIX: Centers vertically */
            user-select: none;
            box-sizing: border-box;
        }

        /* WINDOW FRAME */
        .window {
            background: white;
            border: 2px solid black;
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            min-height: 90vh;
            width: 100%;
            max-width: 720px;
            position: relative;
        }

        /* TITLE BAR */
        .title-bar {
            height: 35px;
            border-bottom: 2px solid black;
            display: flex;
            align-items: center;
            justify-content: center;
            background: white;
            padding: 0 10px;
            position: relative;
            flex-shrink: 0;
        }

        .title-stripes {
            position: absolute;
            top: 4px;
            bottom: 4px;
            left: 4px;
            right: 4px;
            background-image: var(--stripe-pattern);
            z-index: 0;
        }

        .title-text {
            background: white;
            padding: 0 15px;
            font-weight: bold;
            z-index: 1;
            font-size: 1.1rem;
            display: inline-flex;
            align-items: center;
            height: 100%;
            box-sizing: border-box;
        }

        /* CLOSE BUTTON (HOME) */
        .close-box {
            position: absolute;
            left: 10px;
            width: 18px;
            height: 18px;
            border: 2px solid black;
            background: white;
            z-index: 2;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-family: sans-serif;
            font-size: 0.9rem;
            line-height: 1;
            box-shadow: 2px 2px 0 black;
        }

        .close-box:active {
            background: black;
            color: white;
            transform: translate(1px, 1px);
            box-shadow: none;
        }

        /* CONTROLS */
        .controls {
            z-index: 1;
            display: flex;
            position: absolute;
            right: 10px;
        }

        .controls>*+* {
            margin-left: 10px;
        }

        .sys-btn {
            background: white;
            border: 2px solid black;
            padding: 4px 10px;
            font-family: inherit;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 2px 2px 0 black;
            font-size: 0.8rem;
        }

        .sys-btn:active {
            background: black;
            color: white;
            transform: translate(2px, 2px);
            box-shadow: none;
        }

        /* TRANSLATION AREA */
        .translation-container {
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            padding: 12px;
            overflow: hidden;
            min-height: 0;
        }

        .lang-bar {
            display: flex;
            align-items: center;
            padding: 7px 8px;
            border: 2px solid #000;
            background: #e5e5e5;
            flex-shrink: 0;
        }

        .lang-block {
            flex: 1;
            min-width: 0;
        }

        .lang-block + .lang-block {
            margin-left: 8px;
        }

        .lang-label {
            display: block;
            font-size: 0.6rem;
            font-weight: bold;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: #555;
            margin-bottom: 3px;
        }

        .lang-bar select {
            width: 100%;
            height: 30px;
            box-sizing: border-box;
            font-family: inherit;
            font-size: 0.8rem;
            padding: 0 6px;
            border: 2px solid #000;
            border-radius: 0;
            background: #fff;
        }

        .lang-bar .custom-select-container {
            width: 100%;
            height: 30px;
            min-width: 0;
        }

        .lang-bar .custom-select-trigger {
            width: 100%;
            height: 30px;
            box-sizing: border-box;
            line-height: 26px;
            padding: 0 24px 0 6px;
            font-size: 0.78rem;
        }

        .swap-btn {
            width: 34px;
            height: 34px;
            margin: 0 8px;
            border: 2px solid #000;
            background: #fff;
            box-shadow: 2px 2px 0 #000;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            flex-shrink: 0;
            font-family: inherit;
        }

        .swap-btn:active {
            background: #000;
            color: #fff;
            box-shadow: none;
            transform: translate(1px, 1px);
        }

        .text-panel {
            display: flex;
            flex-direction: column;
            flex: 1;
            min-height: 0;
            border: 2px solid #000;
            margin-top: 10px;
            background: #fff;
        }

        .panel-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 5px 9px;
            border-bottom: 2px solid #000;
            background: #f4f4f4;
            font-size: 0.62rem;
            font-weight: bold;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: #555;
            flex-shrink: 0;
        }

        .char-count {
            color: #777;
        }

        .panel-action {
            border: 0;
            background: none;
            font-family: inherit;
            font-size: 0.65rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            text-decoration: underline;
            cursor: pointer;
            color: #333;
            padding: 0;
        }

        textarea {
            flex: 1;
            width: 100%;
            border: 0;
            padding: 12px;
            font-family: "Geneva", "Verdana", sans-serif;
            font-size: 1rem;
            line-height: 1.45;
            resize: none;
            box-sizing: border-box;
            overflow-y: auto;
            min-height: 0;
            background: #fff;
        }

        .output-panel {
            background: #f7f7f7;
        }

        .output-area {
            background: #f7f7f7;
            color: #111;
        }

        .action-bar {
            display: flex;
            align-items: center;
            margin-top: 10px;
            flex-shrink: 0;
        }

        .action-bar .sys-btn {
            height: 36px;
            box-sizing: border-box;
            padding: 0 14px;
            font-size: 0.82rem;
        }

        .secondary-btn {
            background: #fff;
            color: #555;
            box-shadow: 2px 2px 0 #aaa;
        }

        .translate-btn {
            margin-left: auto;
            min-width: 160px;
            background: #000;
            color: #fff;
            box-shadow: 3px 3px 0 #555;
        }
    </style>

<body>
    <!-- seo:h1 --><h1 class="rk-seo-h1">Translator</h1><!-- /seo:h1 -->

    <div class="window">
        <div class="title-bar">
            <div class="title-stripes"></div>
            <!-- Home Button -->
            <div class="close-box" onclick="window.location.href='index'">X</div>

            <span class="title-text" data-i18n="translate.title">Translator</span>
        </div>

        <div class="translation-container">
            <div class="lang-bar">
                <div class="lang-block">
                    <span class="lang-label" data-i18n="translate.label.from">From</span>
                    <select id="source-lang">
                        <option value="auto" data-i18n="translate.lang.auto">Detect</option>
                        <option value="en" selected="" data-i18n="translate.lang.en">English</option>
                        <option value="es" data-i18n="translate.lang.es">Spanish</option>
                        <option value="fr" data-i18n="translate.lang.fr">French</option>
                        <option value="de" data-i18n="translate.lang.de">German</option>
                        <option value="it" data-i18n="translate.lang.it">Italian</option>
                        <option value="pt" data-i18n="translate.lang.pt">Portuguese</option>
                        <option value="ja" data-i18n="translate.lang.ja">Japanese</option>
                        <option value="ko" data-i18n="translate.lang.ko">Korean</option>
                        <option value="zh" data-i18n="translate.lang.zh">Chinese</option>
                        <option value="ru" data-i18n="translate.lang.ru">Russian</option>
                    </select>
                </div>

                <button class="swap-btn" onclick="swapLanguages()" aria-label="Swap languages" title="Swap languages">&#8646;</button>

                <div class="lang-block">
                    <span class="lang-label" data-i18n="translate.label.to">To</span>
                    <select id="target-lang">
                        <option value="en" data-i18n="translate.lang.en">English</option>
                        <option value="es" selected="" data-i18n="translate.lang.es">Spanish</option>
                        <option value="fr" data-i18n="translate.lang.fr">French</option>
                        <option value="de" data-i18n="translate.lang.de">German</option>
                        <option value="it" data-i18n="translate.lang.it">Italian</option>
                        <option value="pt" data-i18n="translate.lang.pt">Portuguese</option>
                        <option value="ja" data-i18n="translate.lang.ja">Japanese</option>
                        <option value="ko" data-i18n="translate.lang.ko">Korean</option>
                        <option value="zh" data-i18n="translate.lang.zh">Chinese</option>
                        <option value="ru" data-i18n="translate.lang.ru">Russian</option>
                    </select>
                </div>
            </div>

            <div class="text-panel">
                <div class="panel-head">
                    <span data-i18n="translate.label.source">Source</span>
                    <span class="char-count" id="char-count">0</span>
                </div>
                <textarea id="source-text" data-i18n-placeholder="translate.ph.source"
                    placeholder="Type text to translate..." oninput="updateCharCount()"></textarea>
            </div>

            <div class="text-panel output-panel">
                <div class="panel-head">
                    <span data-i18n="translate.label.translation">Translation</span>
                    <button type="button" class="panel-action" id="copy-btn" onclick="copyTranslation()"
                        data-i18n="translate.btn.copy">Copy</button>
                </div>
                <textarea id="target-text" class="output-area" readonly="" data-i18n-placeholder="translate.ph.target"
                    placeholder="Translation..."></textarea>
            </div>

            <div class="action-bar">
                <button type="button" class="sys-btn secondary-btn" onclick="clearTranslation()"
                    data-i18n="translate.btn.clear">Clear</button>
                <button class="sys-btn translate-btn" id="translate-btn" onclick="translateText()"
                    data-i18n="translate.btn.translate">Translate</button>
            </div>
        </div>    </div>

    <script>
        // Translation runs in the browser via js/translate-client.js: one
        // MyMemory GET (per-user IP quota, 10x with the contact address) and
        // local language detection, so nothing here can be blocked by CORS
        // (LibreTranslate was, in WebKit). The old lingva.ml + Google gtx
        // backends died on 2026-10-19. No Worker or Pages Function is used —
        // read the header of js/translate-client.js before changing providers.

        // --- INIT ---
        window.onload = () => {
            if (window.rekindleApplyWallpaper) window.rekindleApplyWallpaper();
            updateCharCount();
        };

        function updateCharCount() {
            const input = document.getElementById('source-text');
            const counter = document.getElementById('char-count');
            if (input && counter) counter.innerText = String(input.value.length);
        }

        function clearTranslation() {
            const input = document.getElementById('source-text');
            const output = document.getElementById('target-text');
            if (input) input.value = '';
            if (output) output.value = '';
            updateCharCount();
            if (input) input.focus();
        }

        function copyTranslation() {
            const output = document.getElementById('target-text');
            if (!output || !output.value) return;
            try {
                output.focus();
                output.select();
                document.execCommand('copy');
            } catch (e) {
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(output.value);
                }
            }
        }

        // --- WALLPAPER LOADER ---
        // Helper to HTML-escape text
        function escapeHTML(text) {
            const div = document.createElement('div');
            div.appendChild(document.createTextNode(text));
            return div.innerHTML;
        }

        // Helper to sanitize background image URLs from localStorage
        function sanitizeBackgroundImage(imageString) {
            if (!imageString) return '';
            if (imageString.startsWith('url("data:image/png;base64,')) {
                return imageString;
            }
            if (imageString.startsWith('url("') && imageString.endsWith('")')) {
                const url = imageString.substring(5, imageString.length - 2);
                if ((url.startsWith('http://') || url.startsWith('https://') || url.startsWith('/')) && !url.includes('javascript:')) {
                    return imageString;
                }
            }
            return '';
        }


        let translateBusy = false;

        async function translateText() {
            const text = document.getElementById('source-text').value.trim();
            const source = document.getElementById('source-lang').value;
            const target = document.getElementById('target-lang').value;
            const output = document.getElementById('target-text');
            const btn = document.getElementById('translate-btn');

            if (!text || translateBusy) return;

            if (!window.rekindleTranslateClient) {
                const offline = "Translation is unavailable right now. Try again later.";
                output.value = window.t ? window.t('translate.msg.unavailable', offline) : offline;
                return;
            }

            translateBusy = true;
            if (btn) btn.disabled = true;
            output.value = window.t ? window.t('translate.msg.translating', "Translating...") : "Translating...";

            try {
                output.value = await window.rekindleTranslateClient.translate(text, source, target);
            } catch (e) {
                const code = e && e.code;
                let key = 'translate.msg.network_error';
                let fallback = "Network Error. Check connection.";
                if (code === 'detect') {
                    key = 'translate.msg.detect_failed';
                    fallback = "Could not detect the language. Choose one.";
                } else if (code === 'budget') {
                    key = 'translate.msg.budget';
                    fallback = "Translation limit for this session reached. Try again later.";
                } else if (code === 'unavailable') {
                    key = 'translate.msg.unavailable';
                    fallback = "Translation is unavailable right now. Try again later.";
                }
                output.value = window.t ? window.t(key, fallback) : fallback;
            } finally {
                translateBusy = false;
                if (btn) btn.disabled = false;
            }
        }

        function swapLanguages() {
            const sourceEl = document.getElementById('source-lang');
            const targetEl = document.getElementById('target-lang');
            const textEl = document.getElementById('source-text');
            const outputEl = document.getElementById('target-text');

            const sourceValue = sourceEl.value;
            const targetValue = targetEl.value;

            if (sourceValue === 'auto') {
                // "Detect" is not a valid target. Keep the former target as the
                // new source and pick a sensible target instead of writing
                // auto into the target select (which made Translate do nothing).
                sourceEl.value = targetValue;
                targetEl.value = targetValue === 'en' ? 'es' : 'en';
            } else {
                sourceEl.value = targetValue;
                targetEl.value = sourceValue;
            }

            // Trigger change events for custom select to update UI
            sourceEl.dispatchEvent(new Event('change'));
            targetEl.dispatchEvent(new Event('change'));

            // Also swap text if there is a result
            if (outputEl.value && outputEl.value !== "Translating..." && !outputEl.value.startsWith("Error")) {
                textEl.value = outputEl.value;
                outputEl.value = "";
                updateCharCount();
            }
        }



    </script>
