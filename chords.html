    <script>
        // CONFIG
        const WORKER_URL = "https://chords.timjarnott.workers.dev";
        const firebaseConfig = {
            apiKey: "AIzaSyDY7x7vVmlYUyVZNLuCCmIQYa6PWFVfZqQ",
            authDomain: "rekindle-dd1fa.firebaseapp.com",
            projectId: "rekindle-dd1fa",
            storageBucket: "rekindle-dd1fa.firebasestorage.app",
            messagingSenderId: "748026882518",
            appId: "1:748026882518:web:6877dd4329318070c11c77"
        };

        // --- CONFIGURATION ---
        function showModal(msg, isConfirm = false, callback = null) {
            const overlay = document.getElementById('modal-overlay');
            const messageEl = document.getElementById('modal-message');
            const btnsEl = document.getElementById('modal-btns');
            messageEl.textContent = msg;
            if (isConfirm) {
                btnsEl.innerHTML = '<button class="modal-btn" id="modal-cancel">Cancel</button><button class="modal-btn" id="modal-ok">OK</button>';
                document.getElementById('modal-cancel').onclick = () => { overlay.style.display = 'none'; if (callback) callback(false); };
                document.getElementById('modal-ok').onclick = () => { overlay.style.display = 'none'; if (callback) callback(true); };
            } else {
                btnsEl.innerHTML = '<button class="modal-btn" onclick="hideModal()">OK</button>';
            }
            overlay.style.display = 'flex';
        }
        function hideModal() { document.getElementById('modal-overlay').style.display = 'none'; }

        // INIT FIREBASE
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();



        // Note: Persistence disabled due to IndexedDB hangs on some browsers (Safari)


        // db.enablePersistence({ synchronizeTabs: true }) ...

        // STATE
        let currentUser = null;
        let savedSongs = [];
        let currentView = 'library'; // library, search, song
        let lastView = 'library'; // for back button
        let currentSong = null; // Currently viewing song object

        // --- CLIENT-SIDE CACHE -------------------------------------------------
        // Search results and chord sheets change slowly. Caching in localStorage
        // makes repeat searches instant and survives a worker/network blip
        // without adding any extra worker invocations.
        function chordEsc(value) {
            return String(value == null ? '' : value).replace(/[&<>"']/g, function (c) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
            });
        }

        function cacheRead(key) {
            try {
                const raw = localStorage.getItem('rekindle_chords_cache:' + key);
                return raw ? JSON.parse(raw) : null;
            } catch (e) { return null; }
        }

        function cacheWrite(key, value) {
            try {
                localStorage.setItem('rekindle_chords_cache:' + key, JSON.stringify({
                    at: Date.now(),
                    value: value
                }));
            } catch (e) { /* storage full/disabled */ }
        }

        function cacheFresh(key, maxAgeMs) {
            const hit = cacheRead(key);
            if (hit && hit.at && (Date.now() - hit.at) < maxAgeMs) return hit.value;
            return null;
        }

        async function fetchChordJSON(url, cacheKey, maxAgeMs) {
            const fresh = cacheFresh(cacheKey, maxAgeMs);
            if (fresh !== null) return fresh;

            let lastError = null;
            for (let attempt = 0; attempt < 2; attempt++) {
                try {
                    if (attempt > 0) await new Promise(function (resolve) { setTimeout(resolve, 350); });
                    const response = await fetch(url);
                    if (!response.ok) throw new Error('The chord service returned ' + response.status + '.');
                    const data = await response.json();
                    if (data && data.error) throw new Error(data.error);
                    cacheWrite(cacheKey, data);
                    return data;
                } catch (e) {
                    lastError = e;
                }
            }

            // A stale result is better than an empty screen on a flaky Kindle.
            const stale = cacheRead(cacheKey);
            if (stale && stale.value) return stale.value;
            throw lastError || new Error('Could not reach the chord service.');
        }

        window.onload = () => {
            if (window.rekindleApplyWallpaper) window.rekindleApplyWallpaper();
            if (window.rekindleApplyDefaultFullscreen) window.rekindleApplyDefaultFullscreen();

            auth.onAuthStateChanged(user => {
                if (user) {
                    currentUser = user;
                    syncLibrary();
                } else {
                    loadLocalLibrary();
                }
            });
        };

        // --- NAVIGATION ---

        function switchTab(tab) {
            currentView = tab;
            lastView = tab; // Reset history pivot

            // Buttons
            document.querySelectorAll('.controls .sys-btn').forEach(b => b.classList.remove('active-tab'));
            if (tab === 'library') document.getElementById('tab-library').classList.add('active-tab');
            if (tab === 'search') document.getElementById('tab-search').classList.add('active-tab');

            // Panels
            document.querySelectorAll('.view-panel').forEach(p => p.classList.remove('active'));
            document.getElementById('view-' + tab).classList.add('active');

            if (tab === 'library') renderLibrary();
        }

        function openSong(song) {
            currentSong = song;
            lastView = currentView; // Remember where we came from

            // UI
            document.querySelectorAll('.view-panel').forEach(p => p.classList.remove('active'));
            document.getElementById('view-song').classList.add('active');

            // Set Title
            document.getElementById('detail-title').innerText = `${song.title}`;

            // Set Content state
            const contentEl = document.getElementById('detail-content');
            contentEl.innerHTML = `<div class="loading-msg">${window.t('books.msg.loading', 'Loading...')}</div>`;

            updateSaveButton();

            // Check if we have content cached (if saved)
            if (song.content) {
                renderChordSheet(song.content);
            } else {
                fetchSongContent(song.url);
            }
        }

        function goBack() {
            document.querySelectorAll('.view-panel').forEach(p => p.classList.remove('active'));
            document.getElementById('view-' + lastView).classList.add('active');
            currentSong = null;
        }

        // --- SEARCH API ---

        function handleEnter(e) {
            if (e.key === 'Enter') searchSongs();
        }

        async function searchSongs() {
            const input = document.getElementById('search-input');
            const query = input.value.trim();
            if (!query) {
                document.getElementById('search-meta').innerText = 'Enter a song or artist to search.';
                return;
            }

            const listEl = document.getElementById('search-results');
            const meta = document.getElementById('search-meta');
            listEl.innerHTML = '';
            meta.innerText = 'Searching for "' + query + '"...';
            document.getElementById('search-loading').style.display = 'block';
            document.getElementById('search-placeholder').style.display = 'none';

            try {
                const data = await fetchChordJSON(
                    `${WORKER_URL}?cmd=search&q=${encodeURIComponent(query)}`,
                    'search:' + query.toLowerCase(),
                    6 * 60 * 60 * 1000
                );
                renderSearchResults(Array.isArray(data) ? data : [], query);
            } catch (err) {
                meta.innerText = 'Search unavailable';
                listEl.innerHTML = '<div class="status-error">' +
                    '<div>Could not load chord results. Check your connection and try again.</div>' +
                    '<button class="sys-btn" onclick="searchSongs()">Retry</button></div>';
            } finally {
                document.getElementById('search-loading').style.display = 'none';
            }
        }

        function updateSearchClear() {
            const input = document.getElementById('search-input');
            const clear = document.getElementById('search-clear');
            if (input && clear) clear.style.display = input.value ? 'block' : 'none';
        }

        function clearSearchInput() {
            const input = document.getElementById('search-input');
            if (input) input.value = '';
            updateSearchClear();
            document.getElementById('search-meta').innerText = '';
            document.getElementById('search-results').innerHTML = '';
            document.getElementById('search-placeholder').style.display = 'block';
            input.focus();
        }

        async function fetchSongContent(url) {
            try {
                const data = await fetchChordJSON(
                    `${WORKER_URL}?cmd=get&url=${encodeURIComponent(url)}`,
                    'song:' + url,
                    7 * 24 * 60 * 60 * 1000
                );

                // Update current song object so we can save it with content later
                if (currentSong) currentSong.content = data.content;

                renderChordSheet(data.content);
            } catch (err) {
                document.getElementById('detail-content').innerHTML =
                    '<div class="status-error">' +
                    '<div><strong>Could not load this tab.</strong><br>' +
                    'The chord service may be busy. Try again in a moment.</div>' +
                    '<button class="sys-btn" onclick="fetchSongContent(\'' + chordEsc(currentSong ? currentSong.url : '') + '\')">Retry</button>' +
                    '</div>';
                document.getElementById('status-bar').innerText = 'Chord service unavailable';
            }
        }

        // --- RENDERING ---

        function renderSearchResults(songs, query) {
            const listEl = document.getElementById('search-results');
            const meta = document.getElementById('search-meta');
            listEl.innerHTML = '';

            if (!songs || songs.length === 0) {
                meta.innerText = 'No results for "' + (query || '') + '"';
                listEl.innerHTML = '<div class="status-error">No tabs found. Try a shorter title, or search for the artist.</div>';
                return;
            }

            meta.innerText = songs.length + (songs.length === 1 ? ' result' : ' results') +
                (query ? ' for "' + query + '"' : '');

            songs.forEach(song => {
                const div = document.createElement('div');
                div.className = 'song-item';
                div.innerHTML = `
                    <div class="song-info">
                        <span class="song-title">${chordEsc(song.title)}</span>
                        <span class="song-artist">${chordEsc(song.artist || song.source || 'Guitar tab')}</span>
                    </div>
                    <span class="song-arrow">&gt;</span>
                `;
                div.onclick = () => openSong(song);
                listEl.appendChild(div);
            });
        }

        function renderLibrary() {
            const listEl = document.getElementById('library-list');
            const filterEl = document.getElementById('library-filter');
            const countEl = document.getElementById('library-count');
            const filter = filterEl ? filterEl.value.trim().toLowerCase() : '';
            listEl.innerHTML = '';

            const sorted = savedSongs.slice().sort(function (a, b) {
                return String(a.title || '').localeCompare(String(b.title || ''));
            });

            const visible = sorted.filter(function (song) {
                if (!filter) return true;
                return (String(song.title || '') + ' ' + String(song.artist || '')).toLowerCase().indexOf(filter) !== -1;
            });

            if (countEl) {
                countEl.innerText = visible.length + (filter ? '/' + sorted.length : '') + ' SAVED';
            }

            if (visible.length === 0) {
                listEl.innerHTML = savedSongs.length === 0
                    ? '<div class="status-error">' + window.t('chords.msg.empty_lib', 'Your library is empty. Use Search to find songs.') +
                      '<br><button class="sys-btn" onclick="switchTab(\'search\')">Search songs</button></div>'
                    : '<div class="status-error">No saved songs match that filter.</div>';
                return;
            }

            visible.forEach(song => {
                const div = document.createElement('div');
                div.className = 'song-item';
                div.innerHTML = `
                    <div class="song-info">
                        <span class="song-title">${chordEsc(song.title)}</span>
                        <span class="song-artist">${chordEsc(song.artist || 'Unknown artist')}</span>
                    </div>
                    <span class="song-arrow">&gt;</span>
                `;
                div.onclick = () => openSong(song);
                listEl.appendChild(div);
            });
        }

        function renderChordSheet(text) {
            // Basic formatting for chords if needed, but <pre> usually handles it
            document.getElementById('detail-content').innerText = text;
        }

        function updateSaveButton() {
            const btn = document.getElementById('btn-save');
            const isSaved = savedSongs.some(s => s.url === currentSong.url); // Use URL as unique key

            if (isSaved) {
                btn.innerText = "Remove";
                btn.style.backgroundColor = "#ddd";
            } else {
                btn.innerText = "Save";
                btn.style.backgroundColor = "white";
            }
        }

        // --- DATA PERSISTENCE ---

        function loadLocalLibrary() {
            try {
                savedSongs = JSON.parse(localStorage.getItem('rekindle_chords')) || [];
            } catch (e) { savedSongs = []; }
            renderLibrary();
        }

        function syncLibrary() {
            db.collection('users').doc(currentUser.uid).collection('chords')
                .orderBy('addedAt', 'desc')
                .onSnapshot((snapshot) => {
                    savedSongs = [];
                    snapshot.forEach(doc => {
                        savedSongs.push(doc.data());
                    });
                    if (currentView === 'library') renderLibrary();
                    if (currentSong) updateSaveButton();
                }, (error) => {
                    console.error(error);
                    document.getElementById('status-bar').innerText = window.t('status.sync_error', "Sync Error.");
                });
        }

        function toggleSaveCurrent() {
            if (!currentSong) return;
            const isSaved = savedSongs.some(s => s.url === currentSong.url);

            if (isSaved) {
                // REMOVE
                if (!currentUser) {
                    savedSongs = savedSongs.filter(s => s.url !== currentSong.url);
                    localStorage.setItem('rekindle_chords', JSON.stringify(savedSongs));
                    updateSaveButton();
                } else {
                    // Firestore Remove (Needs ID... we used URL as key? No, we need a doc ID)
                    // We need to query for the doc with this URL to delete it, 
                    // or we should use encoded URL as Doc ID.
                    const docId = btoa(currentSong.url).replace(/\//g, '_').replace(/\+/g, '-').replace(/=/g, '');
                    db.collection('users').doc(currentUser.uid).collection('chords').doc(docId).delete()
                        .then(() => updateSaveButton())
                        .catch(e => showModal("Error removing: " + e));
                }
            } else {
                // SAVE
                const songToSave = {
                    title: currentSong.title,
                    artist: currentSong.artist || "Unknown",
                    url: currentSong.url,
                    source: currentSong.source || "web",
                    content: currentSong.content || "", // Save content if we have it
                    addedAt: Date.now()
                };

                if (!currentUser) {
                    savedSongs.push(songToSave);
                    localStorage.setItem('rekindle_chords', JSON.stringify(savedSongs));
                    updateSaveButton();
                } else {
                    const docId = btoa(currentSong.url).replace(/\//g, '_').replace(/\+/g, '-').replace(/=/g, '');
                    db.collection('users').doc(currentUser.uid).collection('chords').doc(docId).set(songToSave)
                        .then(() => updateSaveButton())
                        .catch(e => showModal("Error saving: " + e));
                }
            }
        }

        // --- WALLPAPER UTILS ---


        function toggleFullScreen() {
            document.querySelector('.window').classList.toggle('fullscreen');
        }


    </script>
