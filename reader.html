<!DOCTYPE html>
<html lang="en">

<head>
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no">
    <meta charset="UTF-8">

    <title>Reader</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.1.5/jszip.min.js" integrity="sha384-6M0rZuK8mRhdpnt5f7OV2x+2kGHdPMTeq8E4qSbS5S4Ohq+Mcq1ZmSWQV3FdawvW" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/epubjs/dist/epub.min.js" integrity="sha384-ZqmkDa/1AGF4SKdSmXgEG+3G+Gsb6yNqUSq2Mqp0jDf1GWk+UY5eNbEd7hgwiywI" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/localforage/1.10.0/localforage.min.js" integrity="sha384-MTDrIlFOzEqpmOxY6UIA/1Zkh0a64UlmJ6R0UrZXqXCPx99siPGi8EmtQjIeCcTH" crossorigin="anonymous"></script>

    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js" integrity="sha384-+KqYOH8TSu3FKjN3ld86eZMYqq6lk+y2GjV1hyOW+1hT3Pk/aD8JFueZP1W3bPh1" crossorigin="anonymous"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js" integrity="sha384-6A4YFdmYPT5gmyRp8KegTqUol1Ff3navFf6eyVLErDtdSrikTwa1MQpVhFtubVlq" crossorigin="anonymous"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js" integrity="sha384-+OubPIxtsLCp2uUuSsvWDuBB9oSIEDIYt2qQfYki+vDmSxc6GQsBbBPH6Z6x5wrq" crossorigin="anonymous"></script>

    <style>
        /* SYSTEM 7 STYLE */
        :root {
            --bg-color: #ffffff;
            --text-color: #000000;
            --border: 2px solid #000000;
            --shadow: 4px 4px 0px #000000;
            --stripe-pattern: repeating-linear-gradient(0deg, transparent, transparent 2px, #000 3px, #000 4px);
        }

        body {
            image-rendering: -webkit-crisp-edges;
            image-rendering: -moz-crisp-edges;
            image-rendering: -o-crisp-edges;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            -ms-interpolation-mode: nearest-neighbor;
            background-repeat: repeat;
            background-position: top left;

            font-family: "Georgia", serif;
            margin: 0;
            height: 100vh;
            overflow: hidden;
            background-color: #e5e5e5;
            /* Background managed by settings */

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            user-select: none;
        }

        .window {
            background: white;
            border: 2px solid black;
            box-shadow: 4px 4px 0px black;
            display: flex;
            flex-direction: column;
            min-height: 95vh;
            width: 100%;
            max-width: 800px;
            position: relative;
        }

        .window.fullscreen {
            position: fixed;
            top: 0;
            left: 0;
            width: calc(100vw / var(--rekindle-scale, 1));
            height: calc(100vh / var(--rekindle-scale, 1));
            max-width: none;
            max-height: none;
            border: none;
            box-shadow: none;
            z-index: 2000;
            transform-origin: top left !important;
        }

        .title-bar {
            height: 35px;
            border-bottom: 2px solid black;
            display: flex;
            align-items: center;
            justify-content: center;
            background: white;
            position: relative;
            flex-shrink: 0;
            font-family: "Helvetica Neue", sans-serif;
        }

        .title-text {
            font-weight: bold;
            background: white;
            padding: 0 15px;
            z-index: 1;
            display: inline-flex;
            align-items: center;
            height: 100%;
            box-sizing: border-box;
            border: none;
        }

        .title-stripes {
            position: absolute;
            top: 4px;
            bottom: 4px;
            left: 4px;
            right: 4px;
            background-image: var(--stripe-pattern);
            z-index: 0;
        }

        .close-box {
            position: absolute;
            left: 10px;
            width: 18px;
            height: 18px;
            border: 2px solid black;
            background: white;
            z-index: 2;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-family: sans-serif;
            font-size: 0.9rem;
            line-height: 1;
            box-shadow: 2px 2px 0 black;
            box-sizing: content-box;
        }

        /* Expand the 18px close box into a 44px touch target without
           changing the standard System 7 visual. */
        .close-box::after {
            content: "";
            position: absolute;
            top: -13px;
            left: -13px;
            right: -13px;
            bottom: -13px;
        }

        .close-box:active {
            background: black;
            color: white;
            transform: translate(1px, 1px);
            box-shadow: none;
        }

        /* CONTROLS (Right side of Title Bar) */
        .title-controls {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            z-index: 2;
            display: flex;
            align-items: center;
        }

        .icon-btn {
            width: 18px;
            height: 18px;
            border: 2px solid black;
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 2px 2px 0 black;
            padding: 0;
            flex-shrink: 0;
        }

        .icon-btn:active {
            background: black;
            color: white;
            transform: translate(1px, 1px);
            box-shadow: none;
        }

        /* Icon State Toggles */
        .icon-contract {
            display: none;
        }

        .window.fullscreen .icon-expand {
            display: none;
        }

        .window.fullscreen .icon-contract {
            display: inline;
        }

        /* READER UI */
        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px;
            border-bottom: 2px solid black;
            background: #eee;
            font-family: sans-serif;
        }

        .sys-btn {
            background: white;
            color: black;
            border: 2px solid black;
            border-radius: 0;
            padding: 4px 12px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 2px 2px 0 black;
            font-family: inherit;
            font-size: 0.85rem;
            -webkit-appearance: none;
            appearance: none;
        }

        .sys-btn:active {
            background: black;
            color: white;
            transform: translate(1px, 1px);
            box-shadow: none;
        }

        .sys-btn[disabled] {
            opacity: 0.4;
            background: white;
            color: black;
            box-shadow: none;
            transform: none;
            cursor: default;
        }

        .nav-group {
            display: flex;
        }

        .nav-group>*+* {
            margin-left: 10px;
        }

        #viewer-container {
            flex-grow: 1;
            overflow: hidden;
            position: relative;
            background: white;
        }

        #epub-render-area {
            width: 100%;
            height: 100%;
        }

        /* PAGE TURN ZONES */
        .click-zone {
            position: absolute;
            top: 0;
            height: 100%;
            width: 20%;
            z-index: 10;
            cursor: pointer;
        }

        #prev-zone {
            left: 0;
        }

        #next-zone {
            right: 0;
            width: 80%;
        }

        /* FOOTER */
        .footer {
            border-top: 2px solid black;
            padding: 5px 10px;
            display: flex;
            justify-content: center;
            background: #eee;
            font-family: monospace;
            font-size: 0.8rem;
        }

        /* LIBRARY OVERLAY */
        #library-overlay {
            position: absolute;
            top: 35px;
            left: 0;
            width: 100%;
            height: calc(100% - 35px);
            background: white;
            z-index: 20;
            display: flex;
            flex-direction: column;
        }

        /* LIB TABS */
        .lib-tabs {
            display: flex;
            border-bottom: 2px solid black;
            background: #eee;
            flex-shrink: 0;
        }

        .lib-tab {
            flex: 1;
            min-height: 48px;
            padding: 10px 4px;
            text-align: center;
            border-right: 1px solid black;
            font-weight: bold;
            cursor: pointer;
            background: #eee;
            font-size: 0.85rem;
            font-family: sans-serif;
            box-sizing: border-box;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .lib-tab:last-child {
            border-right: none;
        }

        .lib-tab.active {
            background: white;
            border-bottom: 2px solid white;
            margin-bottom: -2px;
            z-index: 10;
        }

        /* LIB VIEWS */
        .lib-view {
            flex-grow: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }

        .book-item {
            border: 2px solid black;
            padding: 10px;
            margin-bottom: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            box-shadow: 3px 3px 0 #ccc;
            position: relative;
        }

        .book-item>*+* {
            margin-left: 15px;
        }

        .book-item:active {
            background: black;
            color: white;
            transform: translate(2px, 2px);
            box-shadow: none;
        }

        .cloud-icon {
            font-size: 1.2rem;
            margin-left: auto;
            color: #666;
        }

        .section-title {
            font-size: 0.8rem;
            font-weight: bold;
            border-bottom: 2px solid black;
            padding-bottom: 4px;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-family: sans-serif;
        }

        input[type="text"] {
            flex-grow: 1;
            padding: 8px;
            border: 2px solid black;
            border-radius: 0;
            font-family: inherit;
            font-size: 1rem;
            background: white;
            color: black;
            box-sizing: border-box;
        }

        input[type="file"] {
            display: none;
        }

        #loading-indicator {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.95);
            display: none;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            z-index: 50;
            flex-direction: column;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }

        #loading-indicator>*+* {
            margin-top: 10px;
        }

        /* MODAL STYLES */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            z-index: 10000;
            align-items: center;
            justify-content: center;
            font-family: "Geneva", "Verdana", sans-serif;
        }

        .modal-box {
            background: white;
            border: 2px solid black;
            box-shadow: 8px 8px 0 black;
            padding: 20px;
            max-width: 300px;
            width: 80%;
            text-align: center;
        }

        .modal-buttons {
            display: flex;
            justify-content: center;
            margin-top: 15px;
        }

        .modal-buttons>*+* {
            margin-left: 10px;
        }

        /* GENERIC MODAL SYSTEM */
        #generic-modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            z-index: 10001;
            align-items: center;
            justify-content: center;
            font-family: "Geneva", "Verdana", sans-serif;
        }

        .modal-text {
            margin-bottom: 20px;
            font-weight: bold;
            line-height: 1.4;
            color: black;
        }

        .modal-btns {
            display: flex;
            justify-content: center;
        }

        .modal-btns>*+* {
            margin-left: 10px;
        }

        .modal-btn {
            background: white;
            border: 2px solid black;
            padding: 6px 20px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 2px 2px 0 black;
            font-family: inherit;
        }

        .modal-btn:active {
            background: black;
            color: white;
            transform: translate(1px, 1px);
            box-shadow: none;
        }

        /* ============================================================
           GUTENBERG TAB (merged from gutenberg.html)
           ============================================================ */
        #view-gutenberg {
            padding: 0;
            overflow: hidden;
        }

        #view-gutenberg .gb-search-top {
            flex-shrink: 0;
            padding: 8px;
            background: #eee;
            border-bottom: 2px solid black;
        }

        #view-gutenberg .gb-search-row {
            display: flex;
            align-items: stretch;
        }

        #view-gutenberg #gb-q {
            flex: 1 1 auto;
            min-width: 0;
            height: 44px;
            padding: 0 8px;
            border: 2px solid black;
            border-radius: 0;
            background: white;
            color: black;
            font-family: inherit;
            font-size: 1rem;
            -webkit-appearance: none;
            appearance: none;
        }

        #view-gutenberg #gb-search-btn {
            flex: 0 0 auto;
            margin-left: 6px;
            min-width: 78px;
        }

        #view-gutenberg .chips {
            display: flex;
            flex-wrap: nowrap;
            overflow-x: auto;
            overflow-y: hidden;
            margin-top: 6px;
            -webkit-overflow-scrolling: touch;
        }

        #view-gutenberg .chip {
            flex: 0 0 auto;
            margin: 0 6px 0 0;
            min-height: 44px;
            padding: 0 10px;
            font-size: 0.8rem;
            box-shadow: 2px 2px 0 black;
        }

        #view-gutenberg .chip:last-child {
            margin-right: 0;
        }

        #view-gutenberg .gb-scroll {
            flex: 1 1 auto;
            min-height: 0;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 10px;
            -webkit-overflow-scrolling: touch;
        }

        #gb-shelf {
            display: none;
            margin-bottom: 12px;
        }

        .gb-recent {
            display: flex;
            align-items: stretch;
            margin-bottom: 8px;
            border: 2px solid black;
            background: #f5f5f5;
            box-shadow: 2px 2px 0 black;
        }

        .gb-recent-open {
            flex: 1 1 auto;
            min-width: 0;
            text-align: left;
            background: transparent;
            border: 0;
            border-radius: 0;
            padding: 4px 8px;
            min-height: 48px;
            font-family: inherit;
            color: black;
            cursor: pointer;
            -webkit-appearance: none;
            appearance: none;
        }

        .gb-recent-title {
            display: block;
            font-weight: bold;
            font-size: 0.85rem;
            line-height: 1.25;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .gb-recent-meta {
            display: block;
            font-size: 0.72rem;
            line-height: 1.3;
            margin-top: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .gb-recent-x {
            flex: 0 0 44px;
            width: 44px;
            min-height: 44px;
            border: 0;
            border-left: 2px solid black;
            border-radius: 0;
            background: white;
            color: black;
            font-family: inherit;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            -webkit-appearance: none;
            appearance: none;
        }

        .gb-recent-x:active {
            background: black;
            color: white;
        }

        .gb-search-status {
            display: none;
            font-size: 0.82rem;
            line-height: 1.4;
            margin: 0 0 10px 0;
            padding: 6px 8px;
            border: 2px solid black;
            background: #f5f5f5;
        }

        .gb-search-status.gb-status-error {
            font-weight: bold;
            background: white;
        }

        .gb-book {
            display: flex;
            align-items: stretch;
            border: 2px solid black;
            background: white;
            box-shadow: 2px 2px 0 black;
            margin: 0 0 8px 0;
        }

        .gb-book-open {
            flex: 1 1 auto;
            min-width: 0;
            text-align: left;
            background: transparent;
            border: 0;
            border-radius: 0;
            padding: 7px 9px;
            min-height: 48px;
            font-family: inherit;
            color: black;
            cursor: pointer;
            -webkit-appearance: none;
            appearance: none;
        }

        .gb-book-open:active {
            background: #eee;
        }

        .gb-book-title {
            display: block;
            font-weight: bold;
            font-size: 0.9rem;
            line-height: 1.25;
        }

        .gb-book-meta {
            display: block;
            font-size: 0.76rem;
            line-height: 1.35;
            margin-top: 3px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .gb-get {
            flex: 0 0 62px;
            min-height: 48px;
            padding: 0 4px;
            border: 0;
            border-left: 2px solid black;
            border-radius: 0;
            box-shadow: none;
            font-size: 0.78rem;
        }

        .gb-get:active {
            background: black;
            color: white;
        }

        .gb-get[disabled] {
            opacity: 0.5;
        }

        #gb-more-wrap {
            display: none;
            margin-top: 4px;
        }

        #gb-more-btn {
            width: 100%;
            font-size: 0.82rem;
            min-height: 44px;
        }

        /* ============================================================
           GUTENBERG TEXT READER OVERLAY
           ============================================================ */
        #gb-reader {
            position: absolute;
            top: 35px;
            left: 0;
            width: 100%;
            height: calc(100% - 35px);
            background: white;
            z-index: 30;
            display: none;
            flex-direction: column;
        }

        #gb-reader-head {
            flex-shrink: 0;
            display: flex;
            align-items: center;
            background: #eee;
            border-bottom: 2px solid black;
            padding: 2px 4px 2px 8px;
            min-height: 48px;
        }

        .gb-rh-text {
            flex: 1 1 auto;
            min-width: 0;
            padding-right: 4px;
        }

        #gb-r-title {
            display: block;
            font-family: "Geneva", "Verdana", sans-serif;
            font-weight: bold;
            font-size: 0.85rem;
            line-height: 1.3;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        #gb-r-author {
            display: block;
            font-family: "Geneva", "Verdana", sans-serif;
            font-size: 0.72rem;
            line-height: 1.3;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        #gb-r-source {
            display: block;
            font-family: "Geneva", "Verdana", sans-serif;
            font-size: 0.64rem;
            line-height: 1.3;
            color: #444444;
            margin-top: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        #gb-reader-head.collapsed #gb-r-author,
        #gb-reader-head.collapsed #gb-r-source {
            display: none;
        }

        #gb-head-toggle {
            flex: 0 0 44px;
            width: 44px;
            min-height: 44px;
            padding: 0;
            font-family: "Courier New", monospace;
            font-size: 1rem;
        }

        #gb-notice {
            flex-shrink: 0;
            display: none;
            padding: 4px 8px;
            background: #fffbe6;
            border-bottom: 2px solid black;
            font-family: "Geneva", "Verdana", sans-serif;
            font-size: 0.72rem;
            font-weight: bold;
            line-height: 1.3;
            text-align: center;
        }

        #gb-pane {
            flex: 1 1 auto;
            min-height: 0;
            overflow-y: auto;
            overflow-x: hidden;
            position: relative;
            padding: 12px 14px;
            background: white;
            color: black;
            font-family: Georgia, "Times New Roman", serif;
            font-size: 18px;
            line-height: 1.55;
            -webkit-overflow-scrolling: touch;
            word-wrap: break-word;
            overflow-wrap: break-word;
            scroll-behavior: auto;
        }

        #gb-pane p {
            margin: 0 0 0.85em 0;
        }

        #gb-pane p.gb-h {
            font-family: "Geneva", "Verdana", sans-serif;
            font-weight: bold;
            font-size: 1em;
            text-align: center;
            margin: 1.3em 0 0.9em 0;
        }

        #gb-pane p.gb-status {
            font-family: "Geneva", "Verdana", sans-serif;
            font-size: 0.85rem;
            line-height: 1.5;
        }

        #gb-pane p.gb-error {
            font-weight: bold;
        }

        .gb-bottombar {
            flex-shrink: 0;
            border-top: 2px solid black;
            background: #eee;
            padding: 4px 6px;
        }

        .gb-brow {
            display: flex;
            align-items: center;
        }

        .gb-brow+.gb-brow {
            margin-top: 4px;
        }

        .gb-brow>*+* {
            margin-left: 6px;
        }

        #gb-page-ind {
            flex: 1 1 auto;
            min-width: 0;
            text-align: center;
            font-family: "Courier New", monospace;
            font-size: 0.78rem;
            font-weight: bold;
            white-space: nowrap;
            overflow: hidden;
        }

        #gb-btn-prev,
        #gb-btn-next {
            flex: 0 0 60px;
            padding: 0;
            font-size: 0.82rem;
            min-height: 44px;
        }

        #gb-btn-fontdown,
        #gb-btn-fontup {
            flex: 0 0 50px;
            padding: 0;
            font-family: "Courier New", monospace;
            min-height: 44px;
        }

        #gb-btn-contents,
        #gb-btn-back {
            flex: 1 1 0;
            min-width: 0;
            padding: 0 4px;
            font-size: 0.8rem;
            min-height: 44px;
        }

        /* GUTENBERG CONTENTS MODAL */
        #gb-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 10000;
            font-family: "Geneva", "Verdana", sans-serif;
        }

        #gb-modal.open {
            display: flex;
        }

        .gb-modal-box {
            background: white;
            border: 2px solid black;
            box-shadow: 6px 6px 0 black;
            width: 90%;
            max-width: 420px;
            max-height: 80vh;
            display: flex;
            flex-direction: column;
        }

        .gb-modal-title {
            flex-shrink: 0;
            background: #eee;
            border-bottom: 2px solid black;
            padding: 8px 10px;

    <script>
        // --- FIREBASE CONFIG ---
        const firebaseConfig = {
            apiKey: "AIzaSyDY7x7vVmlYUyVZNLuCCmIQYa6PWFVfZqQ",
            authDomain: "rekindle-dd1fa.firebaseapp.com",
            projectId: "rekindle-dd1fa",
            storageBucket: "rekindle-dd1fa.firebasestorage.app",
            messagingSenderId: "748026882518",
            appId: "1:748026882518:web:6877dd4329318070c11c77"
        };

        // --- GENERIC MODAL ---
        function showModal(msg, isConfirm = false, callback = null) {
            const overlay = document.getElementById('generic-modal-overlay');
            const messageEl = document.getElementById('modal-message');
            const btnsEl = document.getElementById('modal-btns');
            messageEl.textContent = msg;
            if (isConfirm) {
                btnsEl.innerHTML = '<button class="modal-btn" id="modal-cancel">Cancel</button><button class="modal-btn" id="modal-ok">OK</button>';
                document.getElementById('modal-cancel').onclick = () => { overlay.style.display = 'none'; if (callback) callback(false); };
                document.getElementById('modal-ok').onclick = () => { overlay.style.display = 'none'; if (callback) callback(true); };
            } else {
                btnsEl.innerHTML = '<button class="modal-btn" onclick="hideModal()">OK</button>';
            }
            overlay.style.display = 'flex';
        }
        function hideModal() { document.getElementById('generic-modal-overlay').style.display = 'none'; }

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // Note: Persistence disabled due to IndexedDB hangs on some browsers (Safari)

        // db.enablePersistence({ synchronizeTabs: true }) ...

        const auth = firebase.auth();

        // --- STATE ---
        let book = null;
        let rendition = null;
        let currentUser = null;

        let localBooks = []; // From LocalForage
        let cloudBooks = []; // From Firestore
        let mergedLibrary = []; // Combined for display

        let activeLibTab = 'local';

        let deleteTarget = null; // Store { localKey, docId } for deletion modal
        let skipBlankCheck = 0; // Prevent infinite loops in blank page skipper
        let saveTimeout = null; // Debounce timer for saving progress
        let lastValidCfi = null; // Track last known valid position

        // --- INIT ---
        window.onload = () => {
            if (window.rekindleApplyWallpaper) window.rekindleApplyWallpaper();
            if (window.rekindleApplyDefaultFullscreen) window.rekindleApplyDefaultFullscreen();
            loadLocalLibrary();
            auth.onAuthStateChanged(async user => {
                if (user) {
                    currentUser = user;
                    // 1. Sync Guest Books to Cloud (Up)
                    await syncLocalToCloud();
                    // 2. Start Listener (Down)
                    setupCloudListener();
                }
            });

            // AUTO REFRESH when switching back to app
            window.onfocus = () => {
                loadLocalLibrary();
            };
        };

        // Helper to HTML-escape text
        function escapeHtml(text) {
            if (text == null) return "";
            return String(text).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        function setAppTitle(text) {
            const el = document.getElementById('app-title');
            if (el) el.innerText = text;
        }

        // Route requests through the matching proxy. Gutenberg gets its own
        // allowlisted, edge-cached Pages Function; Standard Ebooks has to go to
        // Firebase (see below); everything else uses the generic proxy.
        //
        // standardebooks.org 403s every Cloudflare egress IP (AS132892, the
        // Workers/Pages network), so /api/proxy returns "403 Forbidden" for the
        // feed and every EPUB download. A Cloudflare-hosted proxy cannot be
        // fixed by changing headers — the block is on the source IP. The
        // `standardebooks` Cloud Function runs on Google Cloud, which the site
        // allows, and exposes the same ?url= contract.
        var SE_RELAY_BASE = 'https://us-central1-rekindle-dd1fa.cloudfunctions.net/standardebooks?url=';

        function proxyBaseFor(url) {
            try {
                const host = new URL(url, window.location.href).hostname.toLowerCase();
                if (host === 'gutenberg.org' || host === 'www.gutenberg.org') {
                    return '/api/gutenberg?url=';
                }
                if (host === 'standardebooks.org' || host === 'www.standardebooks.org') {
                    return SE_RELAY_BASE;
                }
            } catch (e) { /* fall through */ }
            return '/api/proxy?url=';
        }

        // --- HELPER: POLYFILL ARRAYBUFFER ---
        function blobToArrayBuffer(blob) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onloadend = () => resolve(reader.result);
                reader.onerror = reject;
                reader.readAsArrayBuffer(blob);
            });
        }

        // --- SYNC LOGIC ---

        // Step 1: Upload any local "guest" books to cloud on login
        async function syncLocalToCloud() {
            if (!currentUser) return;

            const local = await localforage.getItem('library_index') || [];

            // Get current cloud list to avoid duplicates
            const snapshot = await db.collection('users').doc(currentUser.uid).collection('library').get();
            const cloudUrls = new Set();
            snapshot.forEach(doc => {
                const d = doc.data();
                if (d.url) cloudUrls.add(d.url);
            });

            const batch = db.batch();
            let ops = 0;

            for (const lb of local) {
                // If it has a URL (store book) and not in cloud yet
                if (lb.url && !cloudUrls.has(lb.url)) {
                    const newRef = db.collection('users').doc(currentUser.uid).collection('library').doc();
                    batch.set(newRef, {
                        title: lb.title,
                        author: lb.author || 'Unknown',
                        url: lb.url,
                        cfi: null,
                        added: firebase.firestore.FieldValue.serverTimestamp()
                    });
                    ops++;
                }
            }

            if (ops > 0) {
                try {
                    await batch.commit();
                } catch (e) {
                    console.error("Sync error", e);
                }
            }
        }

        // Step 2: Listen for Cloud changes
        function setupCloudListener() {
            db.collection('users').doc(currentUser.uid).collection('library')
                .onSnapshot(async snapshot => {
                    cloudBooks = [];
                    snapshot.forEach(doc => {
                        cloudBooks.push({ ...doc.data(), docId: doc.id });
                    });

                    renderMergedLibrary();
                });
        }

        // 3. Local Loader
        async function loadLocalLibrary() {
            localBooks = await localforage.getItem('library_index') || [];
            renderMergedLibrary();
        }

        // 4. Merger
        function renderMergedLibrary() {
            const list = document.getElementById('book-list');
            list.innerHTML = '';

            mergedLibrary = [];
            const processedUrls = new Set();

            // Process Cloud Books first
            cloudBooks.forEach(cb => {
                // Find locally
                const localMatch = localBooks.find(lb => (cb.url && lb.url === cb.url));

                const displayBook = {
                    ...cb,
                    isDownloaded: !!localMatch,
                    localKey: localMatch ? localMatch.key : null,
                    source: 'cloud'
                };

                mergedLibrary.push(displayBook);
                if (cb.url) processedUrls.add(cb.url);
            });

            // Add Local-Only books (Sideloaded / Not yet synced)
            localBooks.forEach(lb => {
                if (lb.url && processedUrls.has(lb.url)) return;

                // Avoid visual duplicates based on title/author if URL missing (sideloads)
                const alreadyExists = mergedLibrary.some(mb => mb.title === lb.title && mb.author === lb.author);
                if (!alreadyExists) {
                    mergedLibrary.push({
                        ...lb,
                        isDownloaded: true,
                        localKey: lb.key,
                        source: 'local'
                    });
                }
            });

            if (mergedLibrary.length === 0) {
                list.innerHTML = window.rekindleEmptyState(
                    window.t('reader.msg.nobooks', 'No books.<br>Download from Gutenberg or Standard Ebooks.'),
                    { icon: 'book' }
                );
                return;
            }

            // Render
            mergedLibrary.forEach(b => {
                const div = document.createElement('div');
                div.className = 'book-item';

                const statusIcon = b.isDownloaded ? '' : '<span class="cloud-icon">&#9729;</span>';

                div.innerHTML = `
                    <div style="flex-grow:1;">
                        <div style="font-weight:bold;">${escapeHtml(b.title)}</div>
                        <div style="font-size:0.8rem; color:#666;">${escapeHtml(b.author || 'Unknown')}</div>
                    </div>
                    ${statusIcon}
                    <button class="sys-btn" style="padding:4px 8px; margin-left:10px;" onclick="deleteBook(event, '${b.localKey}', '${b.docId}')">&times;</button>
                `;

                div.onclick = () => openBook(b);
                list.appendChild(div);
            });
        }

        // --- BOOK OPENING LOGIC ---
        async function openBook(bookObj) {
            if (!bookObj.isDownloaded) {
                if (bookObj.url) {
                    const success = await fetchAndSaveBook(bookObj.url, bookObj.title, bookObj.author, false); // false = don't add to cloud again
                    if (!success) return;

                    const updatedLocal = await localforage.getItem('library_index') || [];
                    const match = updatedLocal.find(b => b.url === bookObj.url);
                    if (match) {
                        bookObj.localKey = match.key;
                        bookObj.isDownloaded = true;
                    } else {
                        showModal("Download verify failed.");
                        return;
                    }
                } else {
                    showModal("Cannot download: Missing URL.");
                    return;
                }
            }

            let bookData = await localforage.getItem(bookObj.localKey);
            if (!bookData) {
                showModal("Book file corrupt or missing.");
                return;
            }

            // --- LOCAL PROGRESS CHECK (Guest Mode) ---
            let startCfi = bookObj.cfi;
            if (!currentUser && !startCfi) {
                const localIndex = await localforage.getItem('library_index') || [];
                const localEntry = localIndex.find(b => b.key === bookObj.localKey);
                if (localEntry && localEntry.cfi) {
                    startCfi = localEntry.cfi;
                }
            }

            lastValidCfi = startCfi; // Init safe value

            document.getElementById('library-overlay').style.display = 'none';
            setAppTitle(bookObj.title.substring(0, 15) + '...');

            if (book) { book.destroy(); book = null; }
            document.getElementById('epub-render-area').innerHTML = '';

            try {
                book = ePub(bookData);
                rendition = book.renderTo("epub-render-area", {
                    width: "100%", height: "100%",
                    flow: "paginated", manager: "default", spread: "none"
                });

                // BLANK PAGE DETECTION HOOK (FIXED)
                rendition.hooks.content.register((contents, view) => {
                    const doc = contents.document;

                    // Robust text extraction: check both body and documentElement (for XML)
                    const body = doc.body;
                    let text = "";

                    if (body) {
                        text = body.innerText.trim();
                    } else if (doc.documentElement) {
                        text = doc.documentElement.textContent.trim();
                    }

                    // Check for images
                    const hasImg = doc.getElementsByTagName("img").length > 0;
                    const hasSvg = doc.getElementsByTagName("svg").length > 0;
                    const hasImage = doc.getElementsByTagName("image").length > 0;

                    // If no text AND no images, mark blank
                    if (text.length < 20 && !hasImg && !hasSvg && !hasImage) {
                        // Mark on documentElement to ensure visibility
                        doc.documentElement.setAttribute('data-rekindle-blank', 'true');
                        if (body) body.setAttribute('data-rekindle-blank', 'true');
                    }
                });

                await rendition.display(startCfi || undefined);

                rendition.on("relocated", async (location) => {
                    const newCfi = location.start.cfi;

                    // AGGRESSIVE SKIPPER LOGIC
                    let shouldSkip = false;

                    // Check 1: Explicit Blank Attribute
                    try {
                        const views = rendition.getContents();
                        for (let content of views) {
                            const doc = content.document;
                            if (doc.documentElement.getAttribute('data-rekindle-blank') === 'true' ||
                                (doc.body && doc.body.getAttribute('data-rekindle-blank') === 'true')) {
                                shouldSkip = true;
                                break;
                            }
                        }
                    } catch (e) { console.log("Blank check err", e); }

                    // Check 2: Invalid Position Loop (Position stuck on previous page)
                    // If CFI hasn't changed from last known valid, we might be stuck in an empty section
                    // We only check this if we *tried* to move forward (assuming typical forward read)
                    // But we can't easily know direction here.
                    // However, if we are on a page that is blank, we definitely want to move.

                    if (shouldSkip && skipBlankCheck < 50) {
                        skipBlankCheck++;
                        // console.log("Skipping blank/stuck page...");
                        rendition.next();
                        return; // Don't save this position
                    } else {
                        skipBlankCheck = 0; // Reset counter on valid page
                        lastValidCfi = newCfi; // This is a good page
                    }

                    // DEBOUNCED SAVE
                    clearTimeout(saveTimeout);
                    saveTimeout = setTimeout(async () => {
                        if (currentUser && bookObj.docId) {
                            db.collection('users').doc(currentUser.uid).collection('library').doc(bookObj.docId).update({
                                cfi: newCfi
                            });
                        } else if (bookObj.localKey) {
                            const index = await localforage.getItem('library_index') || [];
                            const entryIndex = index.findIndex(b => b.key === bookObj.localKey);
                            if (entryIndex !== -1) {
                                index[entryIndex].cfi = newCfi;
                                await localforage.setItem('library_index', index);
                            }
                        }
                    }, 500);

                    if (location.start.displayed && location.start.displayed.page && location.start.displayed.total) {
                        const percent = Math.round((location.start.displayed.page / location.start.displayed.total) * 100);
                        document.getElementById('progress-text').innerText = percent + "%";
                    }
                });
            } catch (e) {
                showModal("Error opening book: " + e.message);
            }
        }

        // --- DOWNLOAD & CLEAN LOGIC ---

        async function fetchAndSaveBook(url, title, author, addToCloud = true) {
            // Re-downloading a store book should not store a second copy of
            // the blob (the cloud document is deduped separately below).
            try {
                const existingIndex = await localforage.getItem('library_index') || [];
                const existingEntry = existingIndex.find(b => b.url === url);
                if (existingEntry && existingEntry.key) {
                    const existingBlob = await localforage.getItem(existingEntry.key);
                    if (existingBlob) return true;
                }
            } catch (e) { /* storage unavailable: fall through to a download */ }

            showLoading(`Downloading ${title}...`);
            await new Promise(r => setTimeout(r, 100));

            try {
                let blob = null;
                const proxy = proxyBaseFor(url);

                try {
                    const res = await fetch(proxy + encodeURIComponent(url));
                    if (res.ok) {
                        blob = await res.blob();
                    }
                } catch (e) {
                    console.warn("Proxy failed", e);
                }

                if (!blob || blob.size === 0) throw new Error("Empty file");

                const buffer = await blobToArrayBuffer(blob);
                const key = `book_${Date.now()}`;

                await localforage.setItem(key, buffer);

                const newEntry = {
                    title: title,
                    author: author || 'Unknown',
                    url: url,
                    key: key,
                    date: Date.now(),
                    cfi: null
                };

                let index = await localforage.getItem('library_index') || [];
                index.push(newEntry);
                await localforage.setItem('library_index', index);

                if (addToCloud && currentUser) {
                    // Query by URL so a download before the cloud listener starts
                    // cannot create a duplicate document.
                    const snap = await db.collection('users').doc(currentUser.uid).collection('library')
                        .where('url', '==', url).get();
                    if (snap.empty) {
                        await db.collection('users').doc(currentUser.uid).collection('library').add({
                            title: title,
                            author: author || 'Unknown',
                            url: url,
                            cfi: null,
                            added: firebase.firestore.FieldValue.serverTimestamp()
                        });
                    }
                }

                document.getElementById('loading-indicator').style.display = 'none';
                loadLocalLibrary();
                return true;

            } catch (e) {
                showLoadingError(e.message);
                return false;
            }
        }

            function tryFetch(url, timeoutMs) {
                return new Promise(function (resolve, reject) {
                    var settled = false;
                    var controller = null;
                    var timer = null;

                    function finish(err, text) {
                        if (settled) return;
                        settled = true;
                        if (timer) {
                            clearTimeout(timer);
                            timer = null;
                        }
                        if (err) {
                            reject(err);
                        } else {
                            resolve(text);
                        }
                    }

                    var opts = { method: 'GET', credentials: 'omit' };
                    if (typeof AbortController !== 'undefined') {
                        controller = new AbortController();
                        opts.signal = controller.signal;
                    }

                    timer = setTimeout(function () {
                        if (controller) {
                            try { controller.abort(); } catch (e) { /* ignore */ }
                        }
                        finish(new Error('timeout'));
                    }, timeoutMs);

                    fetch(url, opts).then(function (res) {
                        if (!res || !res.ok) {
                            finish(new Error('status ' + (res ? res.status : '0')));
                            return;
                        }
                        res.text().then(function (text) {
                            finish(null, text);
                        }, function (err) {

                        });
                    }, function (err) {

            function parseOpdsFeed(xml) {
                /* Thumbnails are multi-KB base64 data URIs; drop them before
                   matching entries so the regex pass stays cheap. */
                var clean = String(xml).replace(/<link[^>]*rel="http:\/\/opds-spec\.org\/image[^>]*\/>/g, '');
                var books = [];
                var re = /<entry>([\s\S]*?)<\/entry>/g;
                var m;

                while ((m = re.exec(clean)) !== null) {
                    var block = m[1];

                    /* Authors/Subjects subsections have no numeric ebook id. */
                    var idMatch = block.match(/ebooks\/(\d+)\.opds/);
                    if (!idMatch) continue;

                    var title = '';
                    var titleMatch = block.match(/<title[^>]*>([\s\S]*?)<\/title>/);
                    if (titleMatch) title = trim(decodeEntities(stripTags(titleMatch[1])));

                    var author = '';
                    var authorMatch = block.match(/<content[^>]*type="text"[^>]*>([\s\S]*?)<\/content>/);

                var nextMatch = clean.match(/<link[^>]*rel="next"[^>]*href="([^"]+)"/);

            /* ---------------- RECENT SHELF ---------------- */

                        author: item.author ? String(item.author) : '',

                        ts: typeof item.ts === 'number' ? item.ts : 0

            function fetchFeed(url, list, append) {

                    var known = {};
                    var i;
                    for (i = 0; i < list.books.length; i++) {
                        known[String(list.books[i].id)] = true;
                    }

                    for (i = 0; i < parsed.books.length; i++) {
                        var book = parsed.books[i];
                        if (known[String(book.id)]) continue;
                        known[String(book.id)] = true;
                        list.books.push(book);
                        el.results.appendChild(buildBookRow(book));

                    list.nextUrl = parsed.nextUrl || '';
                    updateMore();

                if (state.popular.loaded) {

                } else if (!state.popular.loading) {
                    loadPopular();
                }
            }

            function ensureBrowse() {
                renderShelf();
                if (state.mode !== 'browse') return;
                if (!state.popular.loaded && !state.popular.loading) {
                    loadPopular();
                } else if (state.popular.loaded && !el.results.children.length) {
                    renderPopular();
                }
            }

            function loadMore() {
                var list = currentList();
                if (!list.nextUrl || state.loadingMore) return;

                state.loadingMore = true;
                el.moreBtn.disabled = true;
                setStatus(tr('gutenberg.status.searching', 'Searching...'), false);

                fetchFeed(list.nextUrl, list, true).then(function () {
                    state.loadingMore = false;
                    el.moreBtn.disabled = false;
                });

            /* ---------------- EPUB DOWNLOAD ---------------- */
            function downloadEpub(book, btn) {
                if (!book || !book.id) return;
                btn.disabled = true;
                btn.textContent = tr('gutenberg.btn.saving', 'Saving...');

                var url = GUTENBERG + '/ebooks/' + encodeURIComponent(String(book.id)) + '.epub3.images';
                fetchAndSaveBook(url, book.title, book.author, true).then(function (ok) {
                    if (ok) {
                        btn.textContent = tr('gutenberg.btn.saved', 'In Library');
                        btn.disabled = true;
                    } else {
                        btn.textContent = tr('gutenberg.btn.get', 'Get');
                        btn.disabled = false;
                    }
                });
            }

            /* ---------------- READER ---------------- */
            function setReaderHeader(book) {
                el.rTitle.textContent = book.title || tr('gutenberg.untitled', 'Untitled');
                el.rAuthor.textContent = book.author || tr('gutenberg.author.unknown', 'Unknown author');
            }

            function textCandidates(id) {
                var idPart = encodeURIComponent(String(id));
                return [
                    GUTENBERG + '/cache/epub/' + idPart + '/pg' + idPart + '.txt',
                    GUTENBERG + '/files/' + idPart + '/' + idPart + '-0.txt',
                    GUTENBERG + '/ebooks/' + idPart + '.txt.utf-8'
                ];
            }

            async function loadBookText(id) {
                var urls = textCandidates(id);
                var i;

                /* Cache-first: reopening a book must be instant. */
                for (i = 0; i < urls.length; i++) {
                    var cached = await cacheGet(urls[i]);
                    if (cached) return cached;
                }

                var lastErr = null;
                for (i = 0; i < urls.length; i++) {
                    try {
                        var raw = await fetchText(urls[i]);
                        if (raw && raw.length) {
                            await cachePut(urls[i], raw);
                            return raw;
                        }
                    } catch (e) {
                        lastErr = e;
                    }
                }
                throw lastErr || new Error('no text');
            }

            function openRecent(entry) {
                if (state.busy) return;
                openBook({
                    id: entry.id,
                    title: entry.title,
                    author: entry.author
                });
            }

            async function openBook(book) {
                if (state.busy) return;
                if (state.book && state.ready) savePositionNow();

                state.busy = true;
                state.ready = false;
                state.open = true;
                state.book = book;
                state.headings = [];
                state.pages = 1;
                state.pageIndex = 0;
                state.pct = 0;

                el.reader.style.display = 'flex';
                document.getElementById('library-overlay').style.display = 'none';
                setAppTitle(String(book.title || 'Reader').substring(0, 15) + '...');

                setReaderHeader(book);
                el.notice.style.display = 'none';
                el.notice.textContent = '';
                el.pageInd.textContent = '';
                el.prevBtn.disabled = true;
                el.nextBtn.disabled = true;
                el.pane.scrollTop = 0;
                el.pane.innerHTML = '<p class="gb-status">' +
                    esc(tr('gutenberg.status.loading', 'Opening book...')) + '</p>';

                try {
                    var raw = await loadBookText(book.id);
                    var text = cleanText(raw);

                    if (!text) throw new Error('empty');

                    var truncated = false;
                    if (text.length > MAX_CHARS) {
                        text = text.slice(0, MAX_CHARS);
                        truncated = true;
                    }

                    renderText(text);

                    if (truncated) {
                        el.notice.textContent = tr('gutenberg.notice.long', 'Long book: showing the first part.');
                        el.notice.style.display = 'block';
                    }

                    el.pane.scrollTop = 0;
                    state.ready = true;
                    restorePosition(book.id);
                    addRecent(book);
                    renderShelf();
                    updateFontButtons();

                    el.pane.innerHTML = '<p class="gb-status gb-error">' +

            function backToLibrary() {

                setAppTitle(typeof window.t === 'function' ? window.t('reader.title', 'Reader') : 'Reader');
                setLibTab('gutenberg');
                renderShelf();

            function renderText(text) {
                var blocks = text.split(/\n{2,}/);
                var out = [];
                var headings = [];
                var i, line;

                for (i = 0; i < blocks.length; i++) {
                    if (!blocks[i]) continue;
                    line = trim(blocks[i].replace(/\n/g, ' ').replace(/[ \t]+/g, ' '));
                    if (!line) continue;

                    if (headings.length < MAX_TOC && isHeading(line)) {
                        var id = 'gb-h-' + headings.length;
                        headings.push({ id: id, label: line });
                        out.push('<p class="gb-h" id="' + id + '">' + esc(line) + '</p>');
                    } else {
                        out.push('<p>' + esc(line) + '</p>');
                    }
                }

                /* One wrapper node keeps the i18n MutationObserver from walking
                   thousands of paragraphs one-by-one. */
                var body = document.createElement('div');
                body.className = 'gb-body';
                body.innerHTML = out.join('');

                el.pane.innerHTML = '';
                el.pane.appendChild(body);

            /* ---------------- TEXT CLEANUP ---------------- */
            function cleanText(raw) {
                var text = String(raw || '').replace(/\r\n/g, '\n').replace(/\r/g, '\n');

                var startRe = /\*\*\*\s*START OF (?:THE|THIS) PROJECT GUTENBERG EBOOK[^\n]*\*\*\*/i;
                var endRe = /\*\*\*\s*END OF (?:THE|THIS) PROJECT GUTENBERG EBOOK[^\n]*\*\*\*/i;

                var startMatch = startRe.exec(text);
                if (startMatch) {
                    text = text.slice(startMatch.index + startMatch[0].length);
                }
                var endMatch = endRe.exec(text);
                if (endMatch) {
                    text = text.slice(0, endMatch.index);
                }

                text = text.replace(/\n{3,}/g, '\n\n');
                return trim(text);

            /* ---------------- HEADINGS ---------------- */
            function looksTitleCased(line) {
                if (line === line.toUpperCase()) return true;
                var words = line.split(' ');
                for (var i = 0; i < words.length; i++) {
                    var w = words[i];
                    if (!w) continue;
                    var first = w.charAt(0);
                    if (first === first.toUpperCase()) continue;
                    var bare = trim(w.toLowerCase().replace(/[^a-z]/g, ''));
                    if (i > 0 && SMALL_WORDS[bare]) continue;
                    return false;
                }
                return true;
            }

            function isHeading(line) {
                if (!line || line.length > 60) return false;
                if (!HEAD_RE.test(line)) return false;
                return looksTitleCased(line);

            /* ---------------- PAGINATION ---------------- */
            function pageHeight() {
                return Math.max(1, el.pane.clientHeight || 1);
            }

            function scrollMax() {
                return Math.max(0, el.pane.scrollHeight - pageHeight());

            function measure() {
                var h = pageHeight();
                var total = Math.ceil(el.pane.scrollHeight / h);
                if (!isFinite(total) || total < 1) total = 1;

                var max = scrollMax();

                /* Round so the last, partial page is reachable; pin the index
                   when the pane is scrolled to the very bottom. */
                var idx;
                if (max > 0 && el.pane.scrollTop >= max - 0.5) {
                    idx = total - 1;
                } else {
                    idx = Math.round(el.pane.scrollTop / h);
                }
                if (idx < 0) idx = 0;
                if (idx > total - 1) idx = total - 1;

                state.pages = total;
                state.pageIndex = idx;
                state.pct = max > 0 ? (el.pane.scrollTop / max) : 0;
                updatePager();
            }

            function updatePager() {
                el.pageInd.textContent = tr('gutenberg.label.page', 'Page ${page} / ${pages}')
                    .replace('${page}', String(state.pageIndex + 1))
                    .replace('${pages}', String(state.pages));

                el.nextBtn.disabled = state.pageIndex >= state.pages - 1;

            function goPage(delta) {
                if (!state.ready) return;
                var h = pageHeight();
                var max = scrollMax();
                var target = (state.pageIndex + delta) * h;

                if (target < 0) target = 0;
                if (target > max) target = max;

                el.pane.scrollTop = target;
                measure();
                savePositionNow();
            }

            function scrollPct() {
                var max = scrollMax();
                if (max <= 0) return 0;
                var pct = el.pane.scrollTop / max;
                if (pct < 0) pct = 0;
                if (pct > 1) pct = 1;
                return pct;
            }

            /* ---------------- POSITION ---------------- */
            function positionKey(id) {
                return POS_PREFIX + String(id);
            }

            function savePositionNow() {
                if (!state.book || !state.ready) return;
                var max = scrollMax();
                var pct = max > 0 ? Math.round(scrollPct() * 100) : 0;
                if (pct < 0) pct = 0;
                if (pct > 100) pct = 100;
                writeJson(positionKey(state.book.id), {
                    scrollTop: Math.round(el.pane.scrollTop),
                    pct: pct
                });
                updateRecentPct(state.book.id, pct);
            }

            function scheduleSave() {
                if (saveTimer) clearTimeout(saveTimer);
                saveTimer = setTimeout(function () {
                    saveTimer = null;
                    savePositionNow();
                }, 600);
            }

            function restorePosition(id) {
                var pos = readJson(positionKey(id), null);
                var max = scrollMax();
                var target = 0;

                if (pos) {
                    if (typeof pos.scrollTop === 'number' && isFinite(pos.scrollTop)) {
                        target = pos.scrollTop;
                    } else if (typeof pos.pct === 'number' && isFinite(pos.pct)) {
                        target = max * (pos.pct / 100);
                    }
                }

                if (!(target >= 0)) target = 0;
                if (target > max) target = max;

                el.pane.scrollTop = target;
                measure();
            }

            /* ---------------- FONT SIZE ---------------- */
            function readFont() {
                try {
                    var raw = parseInt(localStorage.getItem(FONT_KEY), 10);
                    if (FONTS.indexOf(raw) !== -1) return raw;
                } catch (e) { /* ignore */ }
                return 18;
            }

            function updateFontButtons() {
                var idx = FONTS.indexOf(state.font);
                if (idx < 0) idx = 1;
                el.fontDown.disabled = idx <= 0;
                el.fontUp.disabled = idx >= FONTS.length - 1;
            }

            function changeFont(delta) {
                var idx = FONTS.indexOf(state.font);
                if (idx < 0) idx = 1;
                idx += delta;
                if (idx < 0) idx = 0;
                if (idx > FONTS.length - 1) idx = FONTS.length - 1;

                var px = FONTS[idx];
                if (px === state.font) return;

                var keep = state.pct;
                state.font = px;
                try {
                    localStorage.setItem(FONT_KEY, String(px));
                } catch (e) { /* ignore */ }

                el.pane.style.fontSize = px + 'px';

                var max = scrollMax();
                el.pane.scrollTop = max * keep;
                measure();
                updateFontButtons();
                if (state.ready) savePositionNow();
            }

            /* ---------------- CONTENTS ---------------- */
            function openContents() {
                el.tocList.innerHTML = '';

                if (!state.headings.length) {
                    var empty = document.createElement('div');
                    empty.className = 'gb-toc-empty';
                    empty.textContent = tr('gutenberg.error.nocontents', 'No chapters found.');
                    el.tocList.appendChild(empty);
                } else {
                    for (var i = 0; i < state.headings.length; i++) {
                        var btn = document.createElement('button');
                        btn.type = 'button';
                        btn.className = 'gb-toc-item';
                        btn.textContent = state.headings[i].label;
                        btn.setAttribute('data-idx', String(i));
                        btn.onclick = onTocClick;
                        el.tocList.appendChild(btn);
                    }
                }
                el.modal.classList.add('open');
            }

            function closeContents() {
                el.modal.classList.remove('open');
            }

            function onTocClick() {
                var idx = parseInt(this.getAttribute('data-idx'), 10);
                var entry = state.headings[idx];
                if (entry) {
                    var target = byId(entry.id);
                    if (target) {
                        var paneRect = el.pane.getBoundingClientRect();
                        var targetRect = target.getBoundingClientRect();
                        var top = el.pane.scrollTop + (targetRect.top - paneRect.top) - 2;
                        if (top < 0) top = 0;
                        var max = scrollMax();
                        if (top > max) top = max;
                        el.pane.scrollTop = top;
                        measure();
                        if (state.ready) savePositionNow();
                    }
                }
                closeContents();
            }

            /* ---------------- HEADER COLLAPSE ---------------- */
            function toggleHeader() {
                var keep = state.pct;
                if (el.head.className.indexOf('collapsed') === -1) {
                    el.head.className = 'collapsed';
                    el.headToggle.textContent = '+';
                } else {
                    el.head.className = '';
                    el.headToggle.textContent = '-';
                }
                if (state.ready) {
                    var max = scrollMax();
                    el.pane.scrollTop = max * keep;
                    measure();
                }
            }

            /* ---------------- EVENT WIRING ---------------- */
            function wire() {
                el.searchBtn.onclick = function () {
                    doSearch(null);
                };

                el.input.addEventListener('keydown', function (e) {
                    if (e.keyCode === 13 || e.key === 'Enter') {
                        e.preventDefault();
                        doSearch(null);
                    }
                });

                // Clearing the box returns to the popular browse list, so the
                // user does not have to hunt for a "back" control on e-ink.
                el.input.addEventListener('input', function () {
                    if (state.mode === 'search' && !trim(el.input.value)) {
                        showBrowse();
                    }
                });

                el.chips.addEventListener('click', function (e) {
                    var node = e.target;
                    while (node && node !== el.chips) {
                        if (node.getAttribute && node.getAttribute('data-q')) {
                            doSearch(node.getAttribute('data-q'));
                            return;
                        }
                        node = node.parentNode;
                    }
                });

                el.moreBtn.onclick = loadMore;

                el.prevBtn.onclick = function () { goPage(-1); };
                el.nextBtn.onclick = function () { goPage(1); };

                el.fontDown.onclick = function () { changeFont(-1); };
                el.fontUp.onclick = function () { changeFont(1); };

                el.contentsBtn.onclick = openContents;
                el.tocClose.onclick = closeContents;

                el.modal.onclick = function (e) {
                    if (e.target === el.modal) closeContents();
                };

                el.backBtn.onclick = backToLibrary;

                el.headToggle.onclick = toggleHeader;

                el.pane.addEventListener('scroll', function () {
                    if (!state.open || !state.ready) return;
                    if (scrollTimer) return;
                    scrollTimer = setTimeout(function () {
                        scrollTimer = null;
                        if (!state.open || !state.ready) return;
                        measure();
                        scheduleSave();
                    }, 120);
                });

                window.addEventListener('resize', function () {
                    if (resizeTimer) clearTimeout(resizeTimer);
                    resizeTimer = setTimeout(function () {
                        resizeTimer = null;
                        if (!state.open || !state.ready) return;
                        var keep = state.pct;
                        measure();
                        var max = scrollMax();
                        el.pane.scrollTop = max * keep;
                        measure();
                        scheduleSave();
                    }, 300);
                });

                window.addEventListener('beforeunload', function () {
                    if (state.ready) savePositionNow();
                });

                document.addEventListener('keydown', function (e) {
                    if ((e.key === 'Escape' || e.keyCode === 27) && el.modal.classList.contains('open')) {
                        closeContents();
                    }
                });
            }

            /* ---------------- INIT ---------------- */
            function init() {

                el.notice = byId('gb-notice');
                el.pageInd = byId('gb-page-ind');
                el.prevBtn = byId('gb-btn-prev');
                el.nextBtn = byId('gb-btn-next');
                el.rTitle = byId('gb-r-title');
                el.rAuthor = byId('gb-r-author');
                el.head = byId('gb-reader-head');
                el.headToggle = byId('gb-head-toggle');
                el.results = byId('gb-results');
                el.moreWrap = byId('gb-more-wrap');
                el.moreBtn = byId('gb-more-btn');
                el.searchStatus = byId('gb-search-status');
                el.resultsTitle = byId('gb-results-title');
                el.shelf = byId('gb-shelf');
                el.shelfList = byId('gb-shelf-list');
                el.input = byId('gb-q');
                el.modal = byId('gb-modal');
                el.tocList = byId('gb-toc-list');
                el.tocClose = byId('gb-toc-close');
                el.searchBtn = byId('gb-search-btn');
                el.chips = byId('gb-chips');
                el.reader = byId('gb-reader');
                el.fontDown = byId('gb-btn-fontdown');
                el.fontUp = byId('gb-btn-fontup');
                el.contentsBtn = byId('gb-btn-contents');
                el.backBtn = byId('gb-btn-back');

                state.font = readFont();
                el.pane.style.fontSize = state.font + 'px';

                el.headToggle.textContent = '-';
                el.headToggle.title = tr('gutenberg.head.toggle', 'Show or hide book details');
                el.headToggle.setAttribute('aria-label', tr('gutenberg.head.toggle', 'Show or hide book details'));

                updatePager();
                updateFontButtons();
                renderShelf();
                wire();
            }

            return {
                init: init,
                ensureBrowse: ensureBrowse,
                renderShelf: renderShelf
            };
        })();

        // ============================================================
        // STANDARD EBOOKS
        // Ported from standardebooks.html. New-release feed downloads are
        // cleaned of blank spine items and saved into the shared library.
        // ============================================================
        var SE = (function () {
            'use strict';

            var RSS_FEED_URL = 'https://standardebooks.org/feeds/rss/new-releases';
            var loaded = false;
            var loading = false;
            var el = {};
            var toastTimer = null;

            function byId(id) {
                return document.getElementById(id);
            }

            function tr(key, fallback) {
                if (typeof window.t === 'function') {
                    return window.t(key, fallback);
                }
                return fallback || key;
            }

            function trim(s) {
                return String(s).replace(/^\s+|\s+$/g, '');
            }

            function showToast(msg) {
                if (!el.toast) return;
                el.toast.innerText = msg;
                el.toast.style.display = 'block';
                if (toastTimer) clearTimeout(toastTimer);
                toastTimer = setTimeout(function () {
                    toastTimer = null;
                    el.toast.style.display = 'none';
                }, 3000);
            }

            function renderLoading(msg) {
                el.grid.innerHTML = '<div class="se-loading">' + escapeHtml(msg) + '</div>';
            }

            function renderError(msg) {
                el.grid.innerHTML = '<div class="se-error">' + escapeHtml(msg) + '</div>';
            }

            async function fetchFeed(url, isBinary) {
                var timeout = isBinary ? 60000 : 20000;
                var res = await fetchWithTimeout(proxyBaseFor(url) + encodeURIComponent(url), timeout);
                if (!res || !res.ok) throw new Error('Status ' + (res ? res.status : '0'));
                return isBinary ? await res.blob() : await res.text();

            function ensureFeed() {
                if (loaded || loading) return;
                loadFeed();
            }

            async function loadFeed() {
                loading = true;
                renderLoading(tr('se.msg.loading', 'Fetching new releases...'));
                el.status.textContent = tr('se.status.connecting', 'Connecting to Standard Ebooks...');

                try {
                    var text = await fetchFeed(RSS_FEED_URL, false);
                    if (!text) throw new Error(tr('se.error.proxies', 'All proxies failed'));
                    loaded = parseAndRenderXML(text);
                } catch (e) {
                    console.error('Standard Ebooks feed error', e);
                    renderError(tr('se.error.feed', 'Failed to load feed. Standard Ebooks may be unreachable.'));
                    el.status.textContent = tr('se.error.feed', 'Failed to load feed. Standard Ebooks may be unreachable.');
                }

                loading = false;
            }

            function parseAndRenderXML(xmlText) {
                try {
                    var parser = new DOMParser();
                    var xmlDoc = parser.parseFromString(xmlText, 'text/xml');

                    var parserError = xmlDoc.getElementsByTagName('parsererror');
                    if (parserError.length > 0) {
                        throw new Error(tr('se.error.xml_parse', 'XML Parsing Error'));
                    }

                    // Atom feed. Accept either shape: RSS <item> first, then
                    // Atom <entry> (which carries <author><name> and
                    // rel="enclosure" links instead of an <enclosure> element).
                    var items = Array.prototype.slice.call(xmlDoc.getElementsByTagName('item'), 0, 15);
                    var isAtom = false;
                    if (!items.length) {
                        items = Array.prototype.slice.call(xmlDoc.getElementsByTagName('entry'), 0, 15);
                        isAtom = true;
                    }

                    if (!items.length) {
                        throw new Error(tr('se.error.no_items', 'No items found in XML'));
                    }

                    renderXmlBooks(items, isAtom);
                    el.status.textContent = tr('se.status.loaded', 'Latest releases') + ' (' + items.length + ')';
                    return true;
                } catch (e) {
                    console.error('Standard Ebooks parse error', e);
                    renderError(tr('se.error.parse', 'Failed to parse feed. ') + e.message);
                    el.status.textContent = tr('se.error.parse', 'Failed to parse feed. ') + e.message;
                    return false;
                }
            }

            function renderXmlBooks(items, isAtom) {
                el.grid.innerHTML = '';

                for (var i = 0; i < items.length; i++) {

                    var titleEl = item.getElementsByTagName('title')[0];

                    }

                    if (!author) author = tr('se.label.unknown_author', 'Unknown Author');
                    if (!title) title = tr('se.label.unknown_title', 'Unknown Title');

                    // EPUB link: Atom uses <link rel="enclosure" type="application/epub+zip">,
                    // RSS uses an <enclosure> element.
                    var dlUrl = null;
                    var links = item.getElementsByTagName('link');

                    for (j = 0; j < links.length; j++) {

                        var linkRel = links[j].getAttribute('rel');
                        if (linkType === 'application/epub+zip' && linkRel === 'enclosure') {
                            dlUrl = links[j].getAttribute('href') || trim(links[j].textContent);
                            break;
                        }
                    }

                    if (!dlUrl) {
                        for (j = 0; j < links.length; j++) {
                            if (links[j].getAttribute('type') === 'application/epub+zip') {

                                break;
                            }
                        }
                    }

                    if (!dlUrl) {
                        var enclosures = item.getElementsByTagName('enclosure');
                        for (j = 0; j < enclosures.length; j++) {
