                                break;
                            }
                        }
                    }

                    // Last resort: the item's first link (old RSS behaviour).
                    if (!dlUrl && links.length) {
                        dlUrl = links[0].getAttribute('href') || trim(links[0].textContent);
                    }

                    if (!dlUrl) continue;

                    // Cover: media:thumbnail (both feeds), then <thumbnail>,
                    // then an <img> inside the description/content.
                    var coverUrl = '';
                    var mediaThumb = item.getElementsByTagName('media:thumbnail')[0];
                    var thumb = item.getElementsByTagName('thumbnail')[0];

                    if (mediaThumb) coverUrl = mediaThumb.getAttribute('url');
                    else if (thumb) coverUrl = thumb.getAttribute('url');

                    if (!coverUrl) {
                        var bodyEl = item.getElementsByTagName('description')[0]
                            || item.getElementsByTagName('content')[0];
                        if (bodyEl) {
                            var match = String(bodyEl.textContent || '').match(/src=["'](.*?)["']/);
                            if (match) coverUrl = match[1];
                        }
                    }

                    // Fix Standard Ebooks relative URLs if needed
                    if (coverUrl && coverUrl.charAt(0) === '/') {
                        coverUrl = 'https://standardebooks.org' + coverUrl;
                    }

                    renderCard(title, author, coverUrl, dlUrl);
                }

                if (!el.grid.children.length) {
                    renderError(tr('se.msg.none', 'No compatible ebooks found.'));
                }
            }

            function renderCard(title, author, coverUrl, dlUrl) {
                var card = document.createElement('div');
                card.className = 'se-book';

                var img = document.createElement('img');
                img.className = 'se-cover';
                img.setAttribute('alt', '');
                if (coverUrl) {
                    img.src = coverUrl;
                    img.onerror = function () { this.style.visibility = 'hidden'; };
                } else {
                    img.style.visibility = 'hidden';
                }

                var info = document.createElement('div');
                info.className = 'se-info';

                var titleEl = document.createElement('span');
                titleEl.className = 'se-title';
                titleEl.textContent = title;

                var authorEl = document.createElement('span');
                authorEl.className = 'se-author';
                authorEl.textContent = author;

                info.appendChild(titleEl);
                info.appendChild(authorEl);

                var btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'sys-btn se-get';
                btn.textContent = tr('se.btn.download', 'Download');
                btn.onclick = function () {
                    downloadBook(dlUrl, title, author, btn);
                };

                card.appendChild(img);
                card.appendChild(info);
                card.appendChild(btn);
                el.grid.appendChild(card);
            }

            async function downloadBook(url, title, author, btn) {
                // Already saved: confirm instead of downloading it again.
                var currentIndex = [];
                try { currentIndex = await localforage.getItem('library_index') || []; } catch (e) { /* ignore */ }
                for (var d = 0; d < currentIndex.length; d++) {
                    // Match by URL, or by title+author for entries saved by the
                    // old standalone app (whose RSS enclosure URL may differ).
                    if (currentIndex[d].url === url ||
                        (currentIndex[d].title === title && currentIndex[d].author === author)) {
                        btn.textContent = tr('se.btn.saved', 'In Library');
                        btn.disabled = true;
                        showToast(tr('se.btn.saved', 'In Library'));
                        return;
                    }
                }

                btn.disabled = true;
                btn.textContent = tr('se.btn.saving', 'Saving...');
                showToast(tr('common.loading', 'Loading') + ' ' + title + '...');

                try {
                    // 1. Fetch File Blob through the proxy
                    var blob = await fetchFeed(url, true);
                    if (!blob || blob.size < 1000) {
                        throw new Error(tr('se.error.invalid_file', 'Invalid file received (too small)'));
                    }

                    // 2. CLEANUP STEP: Remove blank pages
                    showToast(tr('se.msg.clean', 'Cleaning EPUB...'));
                    var cleanedBlob = await cleanEpub(blob);

                    // 3. Convert to ArrayBuffer
                    var buffer = await blobToArrayBuffer(cleanedBlob);

                    // 4. Generate Key
                    var key = 'book_' + Date.now();

                    // 5. Save to LocalForage (shared storage with the reader)
                    await localforage.setItem(key, buffer);

                    // 6. Update Index
                    var index = await localforage.getItem('library_index') || [];
                    var exists = false;
                    for (var i = 0; i < index.length; i++) {
                        if (index[i].title === title && index[i].author === author) {
                            exists = true;
                            break;
                        }
                    }

                    if (!exists) {
                        index.push({
                            title: title,
                            author: author,
                            url: url,
                            key: key,
                            date: Date.now(),
                            cfi: null
                        });
                        await localforage.setItem('library_index', index);
                    }

                    // 7. Cloud Sync (if logged in)
                    if (typeof currentUser !== 'undefined' && currentUser) {
                        var snap = await db.collection('users').doc(currentUser.uid).collection('library')
                            .where('url', '==', url).get();

                        if (snap.empty) {
                            await db.collection('users').doc(currentUser.uid).collection('library').add({
                                title: title,
                                author: author,
                                url: url,
                                cfi: null,
                                added: firebase.firestore.FieldValue.serverTimestamp()
                            });
                        }
                    }

                    btn.textContent = tr('se.btn.saved', 'In Library');
                    showToast(tr('se.msg.saved', 'Book Saved to Reader!'));
                    if (typeof loadLocalLibrary === 'function') loadLocalLibrary();

                } catch (e) {
                    console.error(e);
                    btn.textContent = tr('se.btn.error', 'Error');
                    btn.disabled = false;
                    showToast(tr('se.error.generic', 'Error: ') + e.message);
                }
            }

            // --- EPUB CLEANER (drops blank spine documents) ---
            async function cleanEpub(blob) {
                try {
                    var zip = await JSZip.loadAsync(blob);

                    // 1. Find OPF file path
                    var containerXml = await zip.file('META-INF/container.xml').async('string');
                    var rootfileMatch = containerXml.match(/full-path="([^"]+)"/);
                    if (!rootfileMatch) throw new Error(tr('se.error.invalid_container', 'Invalid Container XML'));

                    var opfPath = rootfileMatch[1];
                    var opfContent = await zip.file(opfPath).async('string');

                    // 2. Parse OPF
                    var parser = new DOMParser();
                    var opfDoc = parser.parseFromString(opfContent, 'application/xml');
                    var manifest = opfDoc.getElementsByTagName('manifest')[0];
                    var spine = opfDoc.getElementsByTagName('spine')[0];
                    var ns = opfDoc.documentElement.namespaceURI;

                    var getItemHref = function (id) {
                        var item = null;
                        try {
                            if (ns) item = manifest.querySelector('[id="' + id + '"]');
                        } catch (e) { /* ignore */ }

                        if (!item) {
                            for (var i = 0; i < manifest.children.length; i++) {
                                if (manifest.children[i].getAttribute('id') === id) {
                                    item = manifest.children[i];
                                    break;
                                }
                            }
                        }
                        return item ? item.getAttribute('href') : null;
                    };

                    // 3. Iterate Spine Items
                    var itemrefs = Array.prototype.slice.call(spine.getElementsByTagName('itemref'));
                    var removedCount = 0;
                    var opfDir = opfPath.substring(0, opfPath.lastIndexOf('/') + 1);

                    for (var r = 0; r < itemrefs.length; r++) {
                        var itemref = itemrefs[r];
                        var id = itemref.getAttribute('idref');
                        var href = getItemHref(id);

                        if (href && (href.indexOf('.html') !== -1 || href.indexOf('.xhtml') !== -1)) {
                            var fullPath = opfDir + href;
                            var file = zip.file(fullPath);

                            if (file) {
                                var content = await file.async('string');

                                // 4. Use textContent for XML/XHTML documents
                                var doc = parser.parseFromString(content, 'application/xml');
                                var text = doc.documentElement.textContent.trim();

                                var hasImg = doc.getElementsByTagName('img').length > 0;
                                var hasSvg = doc.getElementsByTagName('svg').length > 0;
                                var hasImage = doc.getElementsByTagName('image').length > 0;

                                // If text is very short (< 50 chars) AND no images/graphics
                                if (text.length < 50 && !hasImg && !hasSvg && !hasImage) {
                                    spine.removeChild(itemref);
                                    removedCount++;
                                }
                            }
                        }
                    }

                    if (removedCount > 0) {
                        var serializer = new XMLSerializer();
                        zip.file(opfPath, serializer.serializeToString(opfDoc));
                        return await zip.generateAsync({ type: 'blob', mimeType: 'application/epub+zip' });
                    }

                    return blob;

                } catch (e) {
                    console.error('Clean failed, returning original', e);
                    return blob;
                }
            }

            function init() {
                el.grid = byId('se-grid');
                el.status = byId('se-status');
                el.toast = byId('se-toast');
            }

            return {
                init: init,
                ensureFeed: ensureFeed
            };
        })();

        // The inline script sits at the end of <body>, so the DOM is ready.
        // Initialise the library tabs here rather than in window.onload so a
        // slow third-party script cannot leave the tabs dead.
        GB.init();
        SE.init();

    </script>
