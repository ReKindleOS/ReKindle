name = "rekindle-kpm"
main = "worker.js"
compatibility_date = "2024-12-05"

# Only the KPM repo host. The zone route shadows the Pages custom domain, which
# stays attached to the `rekindle` Pages project (the Worker fetches the real
# static files from rekindle.ink/downloads/kpm/). Do not widen this route.
routes = [
  { pattern = "repo.rekindle.ink/*", zone_name = "rekindle.ink" }
]
