        /* WINDOW CONTENT */

        /* WORD LIST */

        #status-msg {
            width: 100%;
            max-width: 520px;
            box-sizing: border-box;
            border: 2px solid #000;
            background: #000;

            letter-spacing: 0.04em;

        }

        /* GAME GRID */
        #grid-container {
            display: grid;
            gap: 1px;
            border: 2px solid black;
            background: black;
            touch-action: none;
            width: 100%;
            max-width: 500px;

        }

        .cell {
            background: white;
            display: flex;

        }

        .cell:hover {
            background: #f4f4f4;
        }

        /* SELECTION STATES */
        .cell.active-start {
            background-color: black;
            color: white;
            border-color: black;
        }

        .cell.drag-preview {
            background: #e5e5e5;
            border-color: #000;
        }

        .cell.found {
            background-color: var(--found-color);
            color: black;
            font-weight: 900;
            border-color: #999;
        }

        #status-msg {
            margin-bottom: 10px;
            font-style: italic;
            height: 1.2em;
            text-align: center;
        }
    </style>

<body>
    <!-- seo:h1 --><h1 class="rk-seo-h1">Word Search</h1><!-- /seo:h1 -->

    <div class="window">
        <div class="title-bar">
            <div class="title-stripes"></div>
            <!-- Home Button -->
            <div class="close-box" onclick="window.location.href='index'">X</div>

            <span class="title-text" data-i18n="wordsearch.title">Word Search</span>

            <div class="controls">
                <button class="sys-btn" onclick="newGame()" data-i18n="wordsearch.btn.reset">Reset</button>
            </div>
        </div>

        <div class="window-content">
            <div id="word-bank">
                <!-- Words injected here -->
            </div>

            <div id="status-msg" data-i18n="wordsearch.status.instruction">Tap start letter, then tap end letter.</div>

            <div id="grid-container">
                <!-- Grid injected here -->
            </div>
        </div>
    </div>

    <script>
        // --- CONFIGURATION ---
        const GRID_SIZE = 10; // 10x10 grid
        const WORD_POOL_EN = [
            "APPLE", "BRAIN", "CLOUD", "DRIVE", "EARTH", "FLAME", "GRAPE", "HEART",
            "IMAGE", "LUNCH", "MONEY", "NIGHT", "OCEAN", "PIANO", "RIVER", "SHARK",
            "TIGER", "VALUE", "WATER", "YOUTH", "ZEBRA", "BREAD", "CHAIR", "DANCE",
            "FRUIT", "GHOST", "HOUSE", "LEMON", "MUSIC", "PAPER", "RADIO", "SNAKE",
            "TABLE", "UNCLE", "VIDEO", "WORLD", "BEACH", "CLOCK", "DREAM", "FEAST"
        ];
        const WORD_POOL_ES = [
            "AGUA", "ARBOL", "BANCO", "BARCO", "CIELO", "COMER", "DULCE", "FUEGO",
            "GATO", "HOJA", "LIBRO", "LUZ", "MANO", "MESA", "NINO", "NUBE", "PAN",
            "PELO", "PLAYA", "QUESO", "RADIO", "RELOJ", "ROSA", "SAL", "SOL", "TREN",
            "VASO", "VIENTO"
        ];
        let WORD_POOL = WORD_POOL_EN;

        // --- STATE ---
        let gridData = [];
        let placedWords = [];
        let foundWords = [];
        let startSelection = null;
        let dragStart = null;
        let dragActive = false;
        let suppressClick = false; // {r, c}

        // --- INIT ---
        window.onload = () => {
            if (window.rekindleApplyWallpaper) window.rekindleApplyWallpaper();

            const lang = localStorage.getItem('rekindle-language') || 'en';
            if (lang === 'es') WORD_POOL = WORD_POOL_ES;
            else WORD_POOL = WORD_POOL_EN;

            newGame();
            // Force resize handling
            window.addEventListener('resize', resizeGrid);
            setTimeout(resizeGrid, 100);
        };

        // --- WALLPAPER LOADER ---

        // --- RESIZE LOGIC (FORCE SQUARE) ---
        function resizeGrid() {
            const container = document.getElementById('grid-container');
            if (container) {
                // Set height equal to width to force perfect square
                container.style.height = container.offsetWidth + 'px';
            }
        }

        function newGame() {
            gridData = Array(GRID_SIZE).fill(null).map(() => Array(GRID_SIZE).fill(''));
            placedWords = [];
            foundWords = [];
            startSelection = null;
            document.getElementById('status-msg').innerText = window.t ? window.t('wordsearch.status.instruction', "Tap start letter, then tap end letter.") : "Tap start letter, then tap end letter.";

            // 1. Pick 6 random words
            const shuffled = [...WORD_POOL].sort(() => 0.5 - Math.random());
            const targets = shuffled.slice(0, 6);

            // 2. Place words
            targets.forEach(word => placeWord(word));

            // 3. Fill empty spaces
            fillGrid();

            // 4. Render
            renderUI(targets);
        }

        // --- LOGIC ---
        function placeWord(word) {
            const dirs = [
                [0, 1],  // Horizontal
                [1, 0],  // Vertical
                [1, 1],  // Diagonal Down-Right
                [-1, 1]  // Diagonal Up-Right
            ];

            let placed = false;
            let attempts = 0;

            while (!placed && attempts < 100) {
                attempts++;
                const dir = dirs[Math.floor(Math.random() * dirs.length)];
                const r = Math.floor(Math.random() * GRID_SIZE);
                const c = Math.floor(Math.random() * GRID_SIZE);

                if (canPlace(word, r, c, dir)) {
                    for (let i = 0; i < word.length; i++) {
                        gridData[r + i * dir[0]][c + i * dir[1]] = word[i];
                    }
                    placedWords.push({
                        word: word,
                        // Store endpoints for validation later if needed
                        start: { r, c },
                        end: { r: r + (word.length - 1) * dir[0], c: c + (word.length - 1) * dir[1] }
                    });
                    placed = true;
                }
            }
        }

        function canPlace(word, r, c, dir) {
            for (let i = 0; i < word.length; i++) {
                const nr = r + i * dir[0];
                const nc = c + i * dir[1];
                if (nr < 0 || nr >= GRID_SIZE || nc < 0 || nc >= GRID_SIZE) return false;
                if (gridData[nr][nc] !== '' && gridData[nr][nc] !== word[i]) return false;
            }
            return true;
        }

        function fillGrid() {
            const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
            for (let r = 0; r < GRID_SIZE; r++) {
                for (let c = 0; c < GRID_SIZE; c++) {
                    if (gridData[r][c] === '') {
                        gridData[r][c] = letters[Math.floor(Math.random() * letters.length)];
                    }
                }
            }
        }

        // --- RENDER ---
        function renderUI(targets) {
            // Word Bank
            const bank = document.getElementById('word-bank');
            bank.innerHTML = '';
            targets.forEach(word => {
                const div = document.createElement('div');
                div.innerText = word;
                div.className = 'word-item';
                div.id = `word-${word}`;
                bank.appendChild(div);
            });

            // Grid
            const container = document.getElementById('grid-container');
            container.style.gridTemplateColumns = `repeat(${GRID_SIZE}, 1fr)`;
            container.innerHTML = '';

            for (let r = 0; r < GRID_SIZE; r++) {
                for (let c = 0; c < GRID_SIZE; c++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    cell.innerText = gridData[r][c];
                    cell.dataset.r = r;
                    cell.dataset.c = c;
                    cell.id = `c-${r}-${c}`;

                    // Click Handler (Tap-Tap Logic)
                    cell.onclick = () => handleTap(r, c);

                    container.appendChild(cell);
                }
            }

            // Ensure square immediately after render
            resizeGrid();
        }

        function cellFromPoint(x, y) {
            const el = document.elementFromPoint(x, y);
            if (!el || !el.closest) return null;
            const cell = el.closest('.cell');
            if (!cell || !cell.id || cell.id.indexOf('c-') !== 0) return null;
            const parts = cell.id.split('-');
            return { r: parseInt(parts[1], 10), c: parseInt(parts[2], 10) };
        }

        function clearDragPreview() {
            document.querySelectorAll('.cell.drag-preview').forEach(function (el) {
                el.classList.remove('drag-preview');
            });
        }

        function previewDragTo(r, c) {
            clearDragPreview();
            if (!startSelection) return;
            const dr = r - startSelection.r;
            const dc = c - startSelection.c;
            if (dr !== 0 && dc !== 0 && Math.abs(dr) !== Math.abs(dc)) return;
            const steps = Math.max(Math.abs(dr), Math.abs(dc));
            const stepR = dr === 0 ? 0 : dr / Math.abs(dr);
            const stepC = dc === 0 ? 0 : dc / Math.abs(dc);
            for (let i = 1; i <= steps; i++) {
                const id = 'c-' + (startSelection.r + i * stepR) + '-' + (startSelection.c + i * stepC);
                const el = document.getElementById(id);
                if (el) el.classList.add('drag-preview');
            }
        }

        function onPointerDown(e) {
            if (!e.isPrimary) return;
            const cell = cellFromPoint(e.clientX, e.clientY);
            if (!cell) return;
            dragStart = cell;
            dragActive = false;
            dragStart.x = e.clientX;
            dragStart.y = e.clientY;
        }

        function onPointerMove(e) {
            if (!dragStart) return;
            const dx = e.clientX - dragStart.x;
            const dy = e.clientY - dragStart.y;
            if (!dragActive && (dx * dx + dy * dy) < 64) return;
            if (!dragActive) {
                dragActive = true;
                suppressClick = true;
                if (startSelection) {
                    const old = document.getElementById('c-' + startSelection.r + '-' + startSelection.c);
                    if (old) old.classList.remove('active-start');
                }
                startSelection = { r: dragStart.r, c: dragStart.c };
                const startEl = document.getElementById('c-' + startSelection.r + '-' + startSelection.c);
                if (startEl) startEl.classList.add('active-start');
            }
            const cell = cellFromPoint(e.clientX, e.clientY);
            if (cell) previewDragTo(cell.r, cell.c);
        }

        function endPointerDrag(e) {
            if (!dragStart) return;
            if (dragActive) {
                const cell = cellFromPoint(e.clientX, e.clientY) || dragStart;
                clearDragPreview();
                const start = startSelection;
                startSelection = null;
                const startEl = start ? document.getElementById('c-' + start.r + '-' + start.c) : null;
                if (startEl) startEl.classList.remove('active-start');
                if (start) handleTapFrom(start, cell);
                setTimeout(function () { suppressClick = false; }, 50);
            }
            dragStart = null;
            dragActive = false;
        }

        // --- INTERACTION (Tap-Tap) ---
        function handleTap(r, c) {
            if (suppressClick) {
                suppressClick = false;
                return;
            }
            handleTapFrom(startSelection, { r: r, c: c });
        }

        function handleTapFrom(startSelectionValue, end) {
            if (!startSelectionValue) {
                startSelection = end;
                const el = document.getElementById(`c-${end.r}-${end.c}`);
                if (el) el.classList.add('active-start');
                return;
            }
            const start = startSelectionValue;
            // 2. If start point exists (Second Tap)
            // Reset visual for start
            const startEl = document.getElementById(`c-${start.r}-${start.c}`);
            if (startEl) startEl.classList.remove('active-start');
            startSelection = null;

            // Validate line
            const dr = end.r - start.r;
            const dc = end.c - start.c;

            // Must be horizontal, vertical, or perfectly diagonal
            if (dr !== 0 && dc !== 0 && Math.abs(dr) !== Math.abs(dc)) {
                return; // Invalid move
            }

            // Calculate word string
            const steps = Math.max(Math.abs(dr), Math.abs(dc));
            const stepR = dr === 0 ? 0 : dr / Math.abs(dr);
            const stepC = dc === 0 ? 0 : dc / Math.abs(dc);

            let wordStr = "";
            let pathIds = [];

            for (let i = 0; i <= steps; i++) {
                const nr = start.r + (i * stepR);
                const nc = start.c + (i * stepC);
                const id = `c-${nr}-${nc}`;
                pathIds.push(id);
                wordStr += document.getElementById(id).innerText;
            }

            // Check if matches word (or reversed)
            const reverseStr = wordStr.split('').reverse().join('');
            const match = document.getElementById(`word-${wordStr}`) || document.getElementById(`word-${reverseStr}`);

            if (match && !match.classList.contains('found')) {
                match.classList.add('found');
                pathIds.forEach(id => {
                    document.getElementById(id).classList.add('found');
                });
                foundWords.push(match.innerText);

                // Win Check
                if (foundWords.length === placedWords.length) {
                    document.getElementById('status-msg').innerText = window.t ? window.t('wordsearch.status.complete', "Puzzle Complete!") : "Puzzle Complete!";
                    // Flash Window Content
                    const content = document.querySelector('.window-content');
                    content.style.filter = "invert(1)";
                    setTimeout(() => { content.style.filter = "invert(0)"; }, 300);
                }
            }
        }

        // Pointer drag selection (mouse, touch, pen) where supported.
        (function attachWordSearchDrag() {
            const grid = document.getElementById('grid-container');
            if (!grid) return;
            grid.addEventListener('pointerdown', onPointerDown);
            document.addEventListener('pointermove', onPointerMove, { passive: true });
            document.addEventListener('pointerup', endPointerDrag);
            document.addEventListener('pointercancel', endPointerDrag);
        })();
    </script>

    <script>
        // Helper to sanitize background image URLs from localStorage
        function sanitizeBackgroundImage(imageString) {
            if (!imageString) return '';
            if (imageString.startsWith('url("data:image/png;base64,')) {
                return imageString;
            }
            if (imageString.startsWith('url("') && imageString.endsWith('")')) {
                const url = imageString.substring(5, imageString.length - 2);
                if ((url.startsWith('http://') || url.startsWith('https://') || url.startsWith('/')) && !url.includes('javascript:')) {
                    return imageString;
                }
            }
            return '';
        }




    </script>
