<!DOCTYPE html><html lang="en"><head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no">
    <meta charset="UTF-8">
    
    <title>Breathing – Guided breathing exercises | ReKindle</title>
    <style>
        /* SYSTEM 7 AESTHETICS */
        :root {
            --bg-color: #ffffff;
            --text-color: #000000;
            --border: 2px solid #000000;
            --shadow: 4px 4px 0px #000000;
            --stripe-pattern: repeating-linear-gradient(0deg, transparent, transparent 2px, #000 3px, #000 4px);
        }

        body {
            image-rendering: -webkit-crisp-edges;
            image-rendering: -moz-crisp-edges;
            image-rendering: -o-crisp-edges;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            -ms-interpolation-mode: nearest-neighbor;
            background-repeat: repeat;
            background-position: top left;

            image-rendering: -webkit-optimize-contrast;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            background-repeat: repeat;
            background-position: top left;

            image-rendering: pixelated;
            image-rendering: crisp-edges;
            background-repeat: repeat;
            background-position: top left;

            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 20px;
            height: 100vh;
            overflow: hidden;
            background-color: #e5e5e5;
            /* Background managed by settings */

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            user-select: none;
            box-sizing: border-box;
        }

        /* WINDOW FRAME */
        .window {
            background: white;
            border: 2px solid black;
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            min-height: 90vh;
            width: 100%;
            max-width: 600px;
            position: relative;
        }

        /* TITLE BAR */
        .title-bar {
            height: 35px;
            border-bottom: 2px solid black;
            display: flex;
            align-items: center;
            justify-content: center;
            background: white;
            padding: 0 10px;
            position: relative;
            flex-shrink: 0;
        }

        .title-stripes {
            position: absolute;
            top: 4px;
            bottom: 4px;
            left: 4px;
            right: 4px;
            background-image: var(--stripe-pattern);
            z-index: 0;
        }

        .title-text {
            background: white;
            padding: 0 15px;
            font-weight: bold;
            z-index: 1;
            font-size: 1.1rem;
            display: inline-flex;
            align-items: center;
            height: 100%;
            box-sizing: border-box;
        }

        /* CLOSE BUTTON */
        .close-box {
            position: absolute;
            left: 10px;
            width: 18px;
            height: 18px;
            border: 2px solid black;
            background: white;
            z-index: 2;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-family: sans-serif;
            font-size: 0.9rem;
            line-height: 1;
            box-shadow: 2px 2px 0 black;
        }

        .close-box:active {
            background: black;
            color: white;
            transform: translate(1px, 1px);
            box-shadow: none;
        }

        /* CONTENT */
        .window-content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 22px 26px;
            background: white;
            overflow: hidden;
        }

        .breath-head {
            text-align: center;
            width: 100%;
        }

        .phase-kicker {
            font-size: 0.66rem;
            letter-spacing: 0.14em;
            font-weight: bold;
            text-transform: uppercase;
            color: #555;
            margin-bottom: 4px;
        }

        /* INSTRUCTION TEXT */
        #instruction-text {
            font-size: 2rem;
            font-weight: 900;
            text-transform: uppercase;
            text-align: center;
            min-height: 2.4rem;
            letter-spacing: 2px;
            line-height: 1.1;
        }

        #timer-text {
            font-family: "Courier New", monospace;
            font-size: 1.05rem;
            margin-top: 4px;
            color: #555;
        }

        /* VISUAL GUIDE */
        .guide-container {
            --breath-level: 0.15;
            --breath-duration: 300ms;
            position: relative;
            width: 300px;
            height: 300px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .guide-ring {
            width: 280px;
            height: 280px;
            border: 2px dashed #bbb;
            border-radius: 50%;
            position: absolute;
            box-sizing: border-box;
        }

        .guide-ring.middle {
            width: 220px;
            height: 220px;
            border: 1px dotted #999;
        }

        .breath-visual {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            align-items: center;
            justify-content: center;
        }

        .guide-container[data-visual="orb"] .orb-visual,
        .guide-container[data-visual="rings"] .rings-visual,
        .guide-container[data-visual="meter"] .meter-visual {
            display: flex;
        }

        .breath-orb {
            width: 50px;
            height: 50px;
            background: #000;
            border-radius: 50%;
            transform: scale(calc(var(--breath-level) * 5.6));
            transition: transform var(--breath-duration) linear;
            will-change: transform;
        }

        .breath-orb::after {
            content: "";
            display: block;
            width: 10px;
            height: 10px;
            margin: 20px auto;
            border-radius: 50%;
            background: #fff;
        }

        .breath-ring {
            position: absolute;
            border-radius: 50%;
            border: 2px solid #000;
            box-sizing: border-box;
            transform: scale(var(--breath-level));
            transition: transform var(--breath-duration) linear;
            will-change: transform;
        }

        .breath-ring.r1 { width: 74px; height: 74px; }
        .breath-ring.r2 { width: 126px; height: 126px; border-style: dashed; border-color: #555; }
        .breath-ring.r3 { width: 178px; height: 178px; border-width: 1px; border-color: #999; }

        .meter-track {
            position: relative;
            width: 76px;
            height: 240px;
            border: 2px solid #000;
            background: #fff;
            overflow: hidden;
        }

        .meter-fill {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            height: calc(var(--breath-level) * 240px);
            background: #000;
            transition: height var(--breath-duration) linear;
            will-change: height;
        }

        .meter-tick {
            position: absolute;
            left: 0;
            right: 0;
            border-top: 1px dotted #777;
            z-index: 1;
        }

        .meter-tick.t1 { bottom: 25%; }
        .meter-tick.t2 { bottom: 50%; }
        .meter-tick.t3 { bottom: 75%; }

        #pattern-meta {
            font-size: 0.72rem;
            color: #555;
            text-align: center;
            margin: 2px 0 4px;
            line-height: 1.4;
        }

        .pattern-panel {
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .visual-controls {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 12px;
        }

        .visual-label {
            font-size: 0.68rem;
            font-weight: bold;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: #555;
            margin-right: 8px;
        }

        .visual-btn {
            background: #fff;
            border: 2px solid #000;
            padding: 3px 8px;
            font-family: inherit;
            font-size: 0.7rem;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: 1px 1px 0 #000;
            margin-right: 6px;
        }

        .visual-btn:last-child {
            margin-right: 0;
        }

        .visual-btn.active {
            background: #000;
            color: #fff;
            box-shadow: none;
            transform: translate(1px, 1px);
        }

        /* CONTROLS */
        .controls {
            display: flex;
            width: 100%;
            max-width: 400px;
            justify-content: center;
        }
        .controls > * + * {
            margin-left: 10px;
}

        .sys-btn {
            background: white;
            border: 2px solid black;
            padding: 8px 10px;
            font-family: inherit;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 3px 3px 0 black;
            font-size: 0.82rem;
            flex: 1;
            text-transform: uppercase;
        }

        .sys-btn.active {
            background: black;
            color: white;
            box-shadow: none;
            transform: translate(1px, 1px);
        }

        .sys-btn:active {
            transform: translate(2px, 2px);
            box-shadow: none;
        }

        #start-stop-btn {
            border-width: 3px;
            width: 100%;
            max-width: 420px;
            margin-top: 12px;
            padding: 10px;
            font-size: 0.9rem;
        }
    </style>

<body>
    <!-- seo:h1 --><h1 class="rk-seo-h1">Breathing</h1><!-- /seo:h1 -->

    <div class="window">
        <div class="title-bar">
            <div class="title-stripes"></div>
            <!-- Home Button -->
            <div class="close-box" onclick="window.location.href='index'">X</div>
            <span class="title-text" data-i18n="breathing.title">Breathing</span>
        </div>

        <div class="window-content">
            <div class="breath-head">
                <div class="phase-kicker" data-i18n="breathing.msg.guide">Breathe with the guide</div>
                <div id="instruction-text" data-i18n="breathing.msg.ready">READY</div>
                <div id="timer-text" data-i18n="breathing.msg.select">Select a pattern</div>
            </div>

            <div class="guide-container" id="guide" data-visual="orb">
                <div class="guide-ring"></div>
                <div class="guide-ring middle"></div>
                <div class="breath-visual orb-visual">
                    <div class="breath-orb"></div>
                </div>
                <div class="breath-visual rings-visual">
                    <div class="breath-ring r1"></div>
                    <div class="breath-ring r2"></div>
                    <div class="breath-ring r3"></div>
                </div>
                <div class="breath-visual meter-visual">
                    <div class="meter-track">
                        <div class="meter-fill"></div>
                        <div class="meter-tick t1"></div>
                        <div class="meter-tick t2"></div>
                        <div class="meter-tick t3"></div>
                    </div>
                </div>
            </div>

            <div class="pattern-panel">
                <div id="pattern-meta">Inhale 4s &middot; Hold 4s &middot; Exhale 4s</div>
                <div class="controls">
                    <button class="sys-btn" id="btn-478" onclick="setPattern('478')"><span data-i18n="breathing.pattern.relax.btn">Relax</span><br><span style="font-size:0.7em">4-7-8</span></button>
                    <button class="sys-btn active" id="btn-box" onclick="setPattern('box')"><span data-i18n="breathing.pattern.focus.btn">Focus</span><br><span style="font-size:0.7em">Box 4s</span></button>
                    <button class="sys-btn" id="btn-balance" onclick="setPattern('balance')"><span data-i18n="breathing.pattern.balance.btn">Balance</span><br><span style="font-size:0.7em">6-6</span></button>
                </div>

                <div class="visual-controls">
                    <span class="visual-label" data-i18n="breathing.visual.label">View</span>
                    <button type="button" class="visual-btn active" data-visual="orb" onclick="setVisual('orb')" data-i18n="breathing.visual.orb">Orb</button>
                    <button type="button" class="visual-btn" data-visual="rings" onclick="setVisual('rings')" data-i18n="breathing.visual.rings">Rings</button>
                    <button type="button" class="visual-btn" data-visual="meter" onclick="setVisual('meter')" data-i18n="breathing.visual.meter">Meter</button>
                </div>

                <button class="sys-btn" id="start-stop-btn" onclick="toggleSession()" data-i18n="breathing.btn.start">Start</button>
            </div>
        </div>
    </div>

    <script>
        // --- CONFIGURATION ---
        const PATTERNS = {
            '478': {
                name: window.t ? window.t('breathing.pattern.relax.name', "Relaxing Breath") : "Relaxing Breath",
                steps: [
                    { label: window.t ? window.t('breathing.step.inhale', "Inhale") : "Inhale", duration: 4000, scale: 1.0 },
                    { label: window.t ? window.t('breathing.step.hold', "Hold") : "Hold", duration: 7000, scale: 1.0 },
                    { label: window.t ? window.t('breathing.step.exhale', "Exhale") : "Exhale", duration: 8000, scale: 0.15 } // 0.15 is min size
                ]
            },
            'box': {
                name: window.t ? window.t('breathing.pattern.focus.name', "Box Breathing") : "Box Breathing",
                steps: [
                    { label: window.t ? window.t('breathing.step.inhale', "Inhale") : "Inhale", duration: 4000, scale: 1.0 },
                    { label: window.t ? window.t('breathing.step.hold', "Hold") : "Hold", duration: 4000, scale: 1.0 },
                    { label: window.t ? window.t('breathing.step.exhale', "Exhale") : "Exhale", duration: 4000, scale: 0.15 },
                    { label: window.t ? window.t('breathing.step.hold', "Hold") : "Hold", duration: 4000, scale: 0.15 }
                ]
            },
            'balance': {
                name: window.t ? window.t('breathing.pattern.balance.name', "Coherence") : "Coherence",
                steps: [
                    { label: window.t ? window.t('breathing.step.inhale', "Inhale") : "Inhale", duration: 6000, scale: 1.0 },
                    { label: window.t ? window.t('breathing.step.exhale', "Exhale") : "Exhale", duration: 6000, scale: 0.15 }
                ]
            }
        };

        // --- STATE ---
        let currentPatternKey = 'box';
        let currentVisual = 'orb';
        let isRunning = false;
        let stepIndex = 0;
        let timer = null;
        let countdownTimer = null;

        // --- ELEMENTS ---
        const guide = document.getElementById('guide');
        const instruction = document.getElementById('instruction-text');
        const subtext = document.getElementById('timer-text');
        const patternMeta = document.getElementById('pattern-meta');
        const startBtn = document.getElementById('start-stop-btn');

        // --- INIT ---
        window.onload = () => {
            if (window.rekindleApplyWallpaper) window.rekindleApplyWallpaper();
            let savedPattern = 'box';
            let savedVisual = 'orb';
            try {
                savedPattern = localStorage.getItem('rekindle_breathing_pattern') || 'box';
                savedVisual = localStorage.getItem('rekindle_breathing_visual') || 'orb';
            } catch (e) { /* storage disabled */ }
            if (!PATTERNS[savedPattern]) savedPattern = 'box';
            if (['orb', 'rings', 'meter'].indexOf(savedVisual) === -1) savedVisual = 'orb';
            setVisual(savedVisual);
            setPattern(savedPattern);
        };


        // --- LOGIC ---
        function setPattern(key) {
            if (isRunning) stopSession();
            currentPatternKey = key;

            // UI Feedback
            document.querySelectorAll('.controls .sys-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(`btn-${key}`).classList.add('active');

            instruction.innerText = window.t ? window.t('breathing.msg.ready', "READY") : "READY";
            subtext.innerText = PATTERNS[key].name;
            if (patternMeta) {
                patternMeta.innerText = PATTERNS[key].steps.map(function (step) {
                    return step.label + ' ' + (step.duration / 1000) + 's';
                }).join(' \u00b7 ');
            }
            try { localStorage.setItem('rekindle_breathing_pattern', key); } catch (e) { }

            // Reset the shared visual level; the visual CSS decides whether that
            // means orb scale, ring scale or meter height.
            guide.style.setProperty('--breath-duration', '300ms');
            guide.style.setProperty('--breath-level', '0.15');
        }

        // Drop the guide back to its resting size without a slow transition.
        // Stopping used to animate for a full second, so a view switch near the
        // end of a breath could leave the new visual stuck at full size.
        function resetGuide() {
            guide.style.setProperty('--breath-duration', '0ms');
            guide.style.setProperty('--breath-level', '0.15');
            void guide.offsetWidth;
            guide.style.setProperty('--breath-duration', '1000ms');
        }

        function setVisual(visual) {
            if (['orb', 'rings', 'meter'].indexOf(visual) === -1) visual = 'orb';
            currentVisual = visual;
            guide.setAttribute('data-visual', visual);
            document.querySelectorAll('.visual-btn').forEach(function (btn) {
                if (btn.getAttribute('data-visual') === visual) btn.classList.add('active');
                else btn.classList.remove('active');
            });
            if (!isRunning) resetGuide();
            try { localStorage.setItem('rekindle_breathing_visual', visual); } catch (e) { }
        }

        function toggleSession() {
            if (isRunning) {
                stopSession();
            } else {
                startSession();
            }
        }

        function startSession() {
            isRunning = true;
            startBtn.innerText = window.t ? window.t('breathing.btn.stop', "Stop") : "Stop";
            startBtn.removeAttribute('data-i18n');
            stepIndex = 0;

            // Start the cycle logic
            runStep();
        }

        function stopSession() {
            isRunning = false;
            clearTimeout(timer);
            clearInterval(countdownTimer);
            startBtn.innerText = window.t ? window.t('breathing.btn.start', "Start") : "Start";
            instruction.innerText = window.t ? window.t('breathing.msg.paused', "PAUSED") : "PAUSED";
            instruction.removeAttribute('data-i18n');
            subtext.innerText = PATTERNS[currentPatternKey].name;
            subtext.removeAttribute('data-i18n');

            resetGuide();
        }

        // --- ANIMATION STEP ---
        function runStep() {
            if (!isRunning) return;

            const pattern = PATTERNS[currentPatternKey];
            const step = pattern.steps[stepIndex];

            // 1. Set the transition duration for this step.
            guide.style.setProperty('--breath-duration', step.duration + 'ms');

            // 2. Set Text
            instruction.innerText = step.label;

            // 3. Move the visual to the step's level (1 = full, 0.15 = settled).
            // The orb, rings and meter all read the same custom property.
            void guide.offsetWidth;
            guide.style.setProperty('--breath-level', String(step.scale));

            // 4. Countdown Timer (Visual feedback)
            let remaining = step.duration / 1000;
            subtext.innerText = remaining.toFixed(0);

            clearInterval(countdownTimer);
            countdownTimer = setInterval(() => {
                remaining -= 1;
                if (remaining >= 0) subtext.innerText = remaining.toFixed(0);
            }, 1000);

            // 5. Schedule Next Step
            timer = setTimeout(() => {
                stepIndex = (stepIndex + 1) % pattern.steps.length;
                runStep();
            }, step.duration);
        }

    </script>
